<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ThinkTray</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%237D5A3C'/><text x='50%25' y='54%25' font-size='19' text-anchor='middle' dominant-baseline='middle' fill='white' font-family='serif'>✦</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════
   THEME VARIABLES — Light (default)
═══════════════════════════════════════ */
:root {
  --bg:          #ffffff;
  --bg2:         #f8f6f2;
  --bg3:         #f0ece4;
  --panel-bg:    #ffffff;
  --panel-head:  #f7f4ef;
  --border:      #e2dbd0;
  --border2:     #cfc6b8;
  --text:        #1a1208;
  --text2:       #5a4a38;
  --text3:       #8a7a68;
  --accent:      #7D5A3C;
  --accent2:     #5a3d28;
  --gold:        #c4902a;
  --gold-lt:     #e8c060;
  --red:         #c0604a;
  --green:       #4a7840;
  --blue:        #3a6080;
  --shadow:      rgba(0,0,0,0.06);
  --shadow2:     rgba(0,0,0,0.14);
  --gap:         8px;
  --r:           6px;
  --r2:          10px;
  --font:        'Inter', system-ui, sans-serif;
  --font-h:      'Playfair Display', Georgia, serif;
  --hh:          84px;  /* two-row header */
  --th:          44px;
  --anim:        0.15s ease;
}
[data-theme="dark"] {
  /* ── WARM SLATE dark mode — research-backed, WCAG AA compliant ──
     Base bg: #0f1117  (GitHub dark, proven by 100M+ devs, warm tint stops harshness)
     Text primary 4.5:1+ contrast. Secondary 7:1+. Tertiary passes 3:1 for UI text.
     Accent: brighter warm amber so it pops on dark without being neon.
     Surfaces step up in warmth to create depth without cold purple tones. */
  --bg:          #0f1117;
  --bg2:         #161b22;
  --bg3:         #1c2230;
  --panel-bg:    #161b22;
  --panel-head:  #1c2230;
  --border:      #30363d;
  --border2:     #444c56;
  --text:        #f0ece4;
  --text2:       #cdc7bc;
  --text3:       #9a9488;
  --accent:      #d4a853;
  --accent2:     #f0c870;
  --gold:        #f0c870;
  --gold-lt:     #f8d890;
  --red:         #e57373;
  --green:       #66bb8a;
  --blue:        #64b5d6;
  --shadow:      rgba(0,0,0,0.4);
  --shadow2:     rgba(0,0,0,0.65);
}

/* ═══════════════════════════════════════ BASE ═══════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body,#root{height:100%;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px}
button{cursor:pointer;font-family:var(--font)}
input,textarea,select{font-family:var(--font);color:var(--text);background:var(--panel-bg)}
a{color:var(--accent)}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
[contenteditable]:empty:before{content:attr(data-placeholder);color:var(--text3);pointer-events:none;font-style:italic}

/* ═══════════════════════════════════════ AUTH ═══════════════════════════════════════ */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#2d1a0a 0%,#1a0e06 60%,#0d0804 100%)}
.auth-card{background:#fff;border-radius:14px;padding:40px 44px;width:420px;
  box-shadow:0 24px 80px rgba(0,0,0,0.55)}
.auth-logo{font-family:var(--font-h);font-size:1.9rem;color:#4a3020;text-align:center;margin-bottom:3px}
.auth-sub{text-align:center;color:#8a7060;font-size:0.83rem;margin-bottom:26px;font-style:italic;font-family:var(--font-h)}
.auth-tabs{display:flex;border-bottom:2px solid #ede8e0;margin-bottom:22px;gap:2px}
.auth-tab{flex:1;padding:8px 6px;text-align:center;font-size:0.85rem;color:#8a7060;background:none;border:none;
  font-weight:600;border-bottom:2px solid transparent;margin-bottom:-2px;transition:var(--anim)}
.auth-tab.on{color:#4a3020;border-bottom-color:#c4902a}
.f{margin-bottom:14px}
.f label{display:block;font-size:0.72rem;font-weight:600;color:#7a6050;text-transform:uppercase;letter-spacing:.07em;margin-bottom:4px}
.f input{width:100%;padding:9px 12px;border:1.5px solid #d8cfc4;border-radius:var(--r);background:#faf8f4;font-size:0.88rem;transition:var(--anim)}
.f input:focus{outline:none;border-color:#c4902a}
.f-row{display:flex;gap:8px;align-items:center}
.f-row input{flex:1}
.btn-ghost{background:none;border:1.5px solid #d8cfc4;border-radius:var(--r);padding:6px 12px;font-size:0.8rem;color:#7a6050;transition:var(--anim)}
.btn-ghost:hover{border-color:#c4902a;color:#c4902a}
.btn-primary{width:100%;padding:11px;background:#7D5A3C;color:#fff;border:none;border-radius:var(--r2);
  font-size:0.92rem;font-weight:700;transition:var(--anim);margin-top:6px}
.btn-primary:hover{background:#5a3d28}
.msg-err{background:#fde8e4;border:1px solid #c0604a;color:#7a1a08;padding:8px 12px;border-radius:var(--r);font-size:0.82rem;margin-bottom:10px}
.msg-ok{background:#e8f4e8;border:1px solid #4a7840;color:#2a5020;padding:8px 12px;border-radius:var(--r);font-size:0.82rem;margin-bottom:10px}

/* ═══════════════════════════════════════ HEADER ═══════════════════════════════════════ */
.hdr{height:var(--hh);background:var(--bg);border-bottom:1px solid var(--border);
  display:flex;flex-wrap:wrap;align-content:center;padding:4px 12px;gap:0;
  position:sticky;top:0;z-index:100;flex-shrink:0}
.hdr-row1{display:flex;align-items:center;gap:4px;width:100%;height:40px}
.hdr-row2{display:flex;align-items:center;justify-content:center;width:100%;height:36px;
  border-top:1px solid var(--border);padding-top:4px;gap:0}
.hdr-logo{font-family:var(--font-h);font-size:1.15rem;color:var(--accent);font-weight:700;white-space:nowrap;margin-right:4px}
.hdr-ver{font-size:0.65rem;color:var(--text3);align-self:flex-end;margin-bottom:4px;font-weight:600}
.hdr-hi{font-size:0.78rem;color:var(--text3);white-space:nowrap}
.sp{flex:1}
.hbtn{background:none;border:1px solid transparent;border-radius:var(--r);padding:5px 10px;
  font-size:0.78rem;color:var(--text2);transition:var(--anim);white-space:nowrap;font-weight:500}
.hbtn:hover{background:var(--bg2);border-color:var(--border);color:var(--text)}
.hbtn.on{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
.seg{display:flex;background:var(--bg2);border-radius:var(--r2);border:1px solid var(--border);overflow:hidden}
.seg button{padding:4px 10px;font-size:0.75rem;background:none;border:none;color:var(--text2);
  transition:var(--anim);font-weight:500;white-space:nowrap;line-height:1.2}
.seg button.on{background:var(--accent);color:#fff;font-weight:700}
/* Mode toggle — 3 equal-width buttons, compact */
.mode-seg{display:flex;border-radius:var(--r2);border:1px solid var(--border);overflow:hidden;background:var(--bg2)}
.mode-seg button{flex:1;padding:5px 20px;font-size:0.8rem;background:none;border:none;
  color:var(--text2);transition:var(--anim);font-weight:600;white-space:nowrap;
  line-height:1;text-align:center;cursor:pointer}
.mode-seg button.on{background:var(--accent);color:#fff;font-weight:700}
.mode-seg button:not(:last-child){border-right:1px solid var(--border)}
/* Privacy toggle */
.priv-seg{display:flex;border-radius:var(--r2);border:1px solid var(--border);overflow:hidden;background:var(--bg2)}
.priv-seg button{padding:5px 9px;font-size:0.72rem;background:none;border:none;
  color:var(--text2);transition:var(--anim);font-weight:500;white-space:nowrap;cursor:pointer}
.priv-seg button.on{background:var(--accent);color:#fff;font-weight:700}
.priv-seg button:first-child{border-right:1px solid var(--border)}
.nb{position:relative}
.n-badge{position:absolute;top:2px;right:2px;background:var(--red);color:#fff;border-radius:50%;
  width:13px;height:13px;font-size:0.6rem;display:flex;align-items:center;justify-content:center;font-weight:700}

/* ═══════════════════════════════════════ MODE TOOLBAR ═══════════════════════════════════════ */
.mode-bar{height:var(--th);background:var(--bg2);border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 12px;gap:8px;flex-shrink:0;overflow-x:auto}
.mode-bar-title{font-size:0.72rem;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-right:4px}
.chip{padding:4px 12px;font-size:0.75rem;border-radius:20px;border:1px solid var(--border);
  background:var(--panel-bg);color:var(--text2);transition:var(--anim);font-weight:500;white-space:nowrap}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
.bar-sep{width:1px;height:22px;background:var(--border);flex-shrink:0}
.add-btn{padding:5px 14px;font-size:0.78rem;border-radius:var(--r);background:var(--accent);
  color:#fff;border:none;font-weight:700;transition:var(--anim)}
.add-btn:hover{background:var(--accent2)}
.srch-btn{padding:5px 12px;font-size:0.78rem;border-radius:var(--r);background:var(--bg);
  color:var(--accent);border:1px solid var(--accent);font-weight:700;transition:var(--anim)}
.srch-btn:hover{background:var(--accent);color:#fff}

/* ═══════════════════════════════════════ GRID & PANELS ═══════════════════════════════════════ */
.app-main{flex:1;overflow-y:auto;padding:var(--gap);background:var(--bg3)}
.ng{display:grid;gap:var(--gap)}
/* Column layouts — flow is always row so panels read top-to-bottom naturally */
.ng-cols-1{grid-template-columns:1fr;grid-auto-flow:row;grid-auto-rows:minmax(280px,auto)}
.ng-cols-2{grid-template-columns:repeat(2,1fr);grid-auto-flow:row;grid-auto-rows:300px}
.ng-cols-3{grid-template-columns:repeat(3,1fr);grid-auto-flow:row;grid-auto-rows:300px}
/* col-picker buttons in mode-bar */
.col-pick{display:flex;gap:2px;align-items:center;margin-left:4px}
.col-pick-btn{padding:3px 7px;font-size:0.7rem;border:1px solid var(--border);border-radius:var(--r);
  background:none;color:var(--text3);cursor:pointer;transition:var(--anim);font-weight:600;line-height:1}
.col-pick-btn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.panel{background:var(--panel-bg);border-radius:var(--r);border:1px solid var(--border);
  box-shadow:0 1px 4px var(--shadow);display:flex;flex-direction:column;overflow:hidden;
  position:relative;min-height:0;transition:box-shadow var(--anim)}
.panel:hover{box-shadow:0 3px 10px var(--shadow2)}
.ph{background:var(--panel-head);padding:6px 8px;display:flex;align-items:center;gap:5px;
  border-bottom:1px solid var(--border);flex-shrink:0}
.ph-title{font-family:var(--font-h);font-size:0.82rem;font-weight:600;color:var(--text);flex:1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph-badge{font-size:0.62rem;background:var(--accent);color:#fff;border-radius:10px;padding:1px 6px;font-weight:700}
.pb{flex:1;display:flex;min-height:0;overflow:hidden}
.pc{flex:1;padding:6px 8px;overflow-y:auto;min-height:0}
/* SIDEBAR — horizontal text, ~40% width, collapsible */
.psb{width:22px;background:var(--bg2);border-left:1px solid var(--border);display:flex;
  flex-direction:column;align-items:center;padding:4px 0;gap:3px;flex-shrink:0;overflow:hidden;transition:width .2s ease;cursor:pointer}
.psb.open{width:48%;padding:6px;cursor:default}
.psb-tab{writing-mode:vertical-rl;font-size:0.62rem;font-weight:700;color:var(--text3);
  text-transform:uppercase;letter-spacing:.08em;user-select:none;margin:auto;white-space:nowrap;
  transform:rotate(180deg);transition:var(--anim)}
.psb.open .psb-tab{display:none}
.psb-close{display:none;background:none;border:none;color:var(--text3);font-size:0.8rem;
  cursor:pointer;padding:0 0 4px;width:100%;text-align:right;transition:var(--anim)}
.psb.open .psb-close{display:block}
.psb-btns{display:none;flex-direction:column;gap:3px;width:100%;flex:1;overflow-y:auto}
.psb.open .psb-btns{display:flex}
.sb-btn{width:100%;padding:5px 9px;background:none;border:1px solid var(--border);
  border-radius:var(--r);font-size:0.75rem;color:var(--text2);text-align:left;
  transition:var(--anim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500;cursor:pointer}
.sb-btn:hover,.sb-btn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.sb-toggle{background:none;border:none;color:var(--text3);font-size:0.9rem;padding:2px;line-height:1;transition:var(--anim)}
.sb-toggle:hover{color:var(--accent)}
/* Panel view toggle — list vs full card */
.view-seg{display:flex;gap:2px;margin-left:2px}
.view-seg button{background:none;border:1px solid var(--border);border-radius:3px;
  font-size:0.65rem;padding:2px 5px;color:var(--text3);cursor:pointer;transition:var(--anim)}
.view-seg button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
/* Full card view */
.full-card{padding:8px;display:flex;flex-direction:column;gap:6px}
.full-card-title{font-family:var(--font-h);font-size:0.92rem;font-weight:700;color:var(--text)}
.full-card-meta{font-size:0.7rem;color:var(--text3)}
.full-card-line{font-size:0.8rem;color:var(--text);padding:3px 0;border-bottom:1px solid var(--border)}
.full-card-line:last-child{border:none}
.full-card-att{font-size:0.72rem;color:var(--accent);padding:2px 0;cursor:pointer;text-decoration:underline}
.irow{display:flex;align-items:center;gap:3px}
.ib{background:none;border:none;color:var(--text3);font-size:0.82rem;padding:2px 4px;border-radius:3px;transition:var(--anim);line-height:1}
.ib:hover{color:var(--accent);background:rgba(124,90,60,0.08)}

/* ═══════════════════════════════════════ NOTE ITEMS ═══════════════════════════════════════ */
.ni{padding:6px 8px;border-bottom:1px solid var(--border);cursor:pointer;transition:background var(--anim);border-radius:4px;margin-bottom:1px;position:relative}
.ni:hover{background:var(--bg2)}
.idx-btns{position:absolute;top:4px;right:4px;display:none;gap:3px;z-index:5}
.ni:hover .idx-btns{display:flex}
.idx-btn{background:var(--bg2);border:1px solid var(--border);border-radius:4px;padding:1px 6px;font-size:0.65rem;cursor:pointer;color:var(--text3);font-weight:700;line-height:1.5;transition:var(--anim)}
.idx-btn:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.ni-inline{width:100%;border:none;border-bottom:1.5px solid var(--accent);outline:none;font-size:0.82rem;font-weight:600;color:var(--text);padding:1px 0;font-family:var(--font);resize:none;line-height:1.4;display:block;background:transparent;box-sizing:border-box}
.ni-expand{background:none;border:none;color:var(--text3);cursor:pointer;font-size:0.7rem;padding:0 3px;margin-top:2px;flex-shrink:0;line-height:1;transition:var(--anim)}
.ni-expand:hover{color:var(--accent)}
.ni-acc-item{font-size:0.74rem;color:var(--text2);padding:2px 0;cursor:text}
.ni-acc-item:hover{color:var(--text)}
.idx-btn.starred{color:var(--accent)}
.panel.collapsed .pb{display:none}
.panel.collapsed{height:auto!important}
.move-dd{position:fixed;z-index:600;background:var(--panel-bg);border:1px solid var(--border);border-radius:var(--r);box-shadow:0 4px 20px var(--shadow2);min-width:180px;max-height:260px;overflow-y:auto}
.move-dd-item{padding:8px 14px;cursor:pointer;font-size:0.83rem;color:var(--text);border-bottom:1px solid var(--border)}
.move-dd-item:hover{background:var(--bg2);color:var(--accent)}
.ph-title-edit{background:none;border:none;border-bottom:1.5px solid var(--accent);outline:none;font-family:var(--font-h);font-size:0.88rem;font-weight:700;color:var(--text);padding:0;max-width:160px;cursor:text;line-height:1}
.ni-name{font-size:0.82rem;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ni-meta{font-size:0.68rem;color:var(--text3);margin-top:1px}
.ni-body{font-size:0.75rem;color:var(--text2);margin-top:3px;display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.badges{display:flex;gap:3px;margin-top:3px;flex-wrap:wrap}
.badge{font-size:0.62rem;padding:1px 5px;border-radius:8px;font-weight:600}
.b-priv{background:#fde8e4;color:#8a2010}
.b-fav{background:#fdf4d0;color:#7a5000}
.b-cat{background:var(--bg2);color:var(--text2);border:1px solid var(--border)}
.b-prog{background:#e4f0e4;color:#2a5020}
.empty{text-align:center;color:var(--text3);font-size:0.78rem;padding:20px 8px;font-style:italic}

/* ═══════════════════════════════════════ FORMS ═══════════════════════════════════════ */
.fg{display:flex;flex-direction:column;gap:4px;flex:1}
.fg label{font-size:0.7rem;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.05em}
.fg input,.fg textarea,.fg select{padding:6px 9px;border:1.5px solid var(--border);border-radius:var(--r);
  background:var(--bg2);color:var(--text);font-size:0.82rem;transition:border-color var(--anim)}
.fg input:focus,.fg textarea:focus,.fg select:focus{outline:none;border-color:var(--gold)}
.fg textarea{resize:vertical;min-height:70px}
.frow{display:flex;gap:8px;margin-bottom:10px}
.bs{padding:5px 12px;font-size:0.78rem;border-radius:var(--r);border:none;font-weight:700;transition:var(--anim);cursor:pointer}
.b-save{background:var(--accent);color:#fff}
.b-save:hover{background:var(--accent2)}
.b-cancel{background:var(--bg2);color:var(--text2);border:1px solid var(--border)}
.b-cancel:hover{background:var(--border)}
.b-del{background:var(--red);color:#fff}
.b-del:hover{background:#a04030}
.b-ok{background:var(--green);color:#fff}

/* ═══════════════════════════════════════ TEXT CONTROLS ═══════════════════════════════════════ */
.tc-row{display:flex;gap:3px;margin-bottom:6px;flex-wrap:wrap}
.tc{width:28px;height:26px;background:var(--bg2);border:1px solid var(--border);border-radius:4px;
  font-size:0.78rem;color:var(--text);display:flex;align-items:center;justify-content:center;
  font-weight:700;transition:var(--anim);cursor:pointer}
.tc:hover{background:var(--accent);color:#fff;border-color:var(--accent)}

/* ═══════════════════════════════════════ MODAL ═══════════════════════════════════════ */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:200;
  display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--panel-bg);border-radius:var(--r2);width:100%;max-width:580px;
  max-height:92vh;display:flex;flex-direction:column;box-shadow:0 20px 70px var(--shadow2);border:1px solid var(--border)}
.mh{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;
  background:var(--panel-head);border-radius:var(--r2) var(--r2) 0 0;flex-shrink:0}
.mt{font-family:var(--font-h);font-size:1rem;font-weight:700;color:var(--text);flex:1}
.mb{flex:1;overflow-y:auto;padding:18px}
.mf{padding:12px 18px;border-top:1px solid var(--border);display:flex;gap:8px;
  justify-content:flex-end;background:var(--bg2);flex-shrink:0;border-radius:0 0 var(--r2) var(--r2)}
/* Full-screen overlay panel */
.fs-panel{position:fixed;inset:0;background:var(--bg);z-index:190;display:flex;flex-direction:column;overflow:hidden}
.fs-head{padding:12px 16px;background:var(--panel-head);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;flex-shrink:0}
.fs-title{font-family:var(--font-h);font-size:1.05rem;font-weight:700;color:var(--text);flex:1}
.fs-body{flex:1;overflow-y:auto;padding:16px}
/* Detail view grid */
.dv-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dv-top{grid-column:1/-1;background:var(--panel-head);border:1px solid var(--border);

<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef,useCallback,createContext,useContext,useMemo}=React;

// ═══════════════════════════════════════════════════════════════
// DATABASE — Supabase
// ═══════════════════════════════════════════════════════════════
const SUPABASE_URL = 'https://cuxejgyekvoenwqmrabr.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN1eGVqZ3lla3ZvZW53cW1yYWJyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzNDE4MzcsImV4cCI6MjA5NTkxNzgzN30.Wt404OQIc81ZXtqXYMXtmBghjuctPHBJRf2b1DKscxk';

// Supabase client (loaded from CDN in <head>)
const _sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ── helpers ──
const now = () => new Date().toISOString();
const uid = () => _sb.auth.getUser().then(r => r.data.user?.id);

// Throw on Supabase error
function chk({data, error}) {
  if (error) throw error;
  return data;
}

const Auth = {
  async register(email, username, password) {
    const { data, error } = await _sb.auth.signUp({
      email, password,
      options: { data: { username } }
    });
    if (error) throw error;
    return data.user;
  },
  async login(email, password) {
    const { data, error } = await _sb.auth.signInWithPassword({ email, password });
    if (error) throw error;
    // Store minimal session info for getSession()
    localStorage.setItem('ng4_session', JSON.stringify({ userId: data.user.id }));
    return data.user;
  },
  async resetPassword(email) {
    const { error } = await _sb.auth.resetPasswordForEmail(email);
    if (error) throw error;
  },
  logout() {
    localStorage.removeItem('ng4_session');
    return _sb.auth.signOut();
  },
  getSession() {
    const s = localStorage.getItem('ng4_session');
    return s ? JSON.parse(s) : null;
  },
  async getUser(id) {
    const { data } = await _sb.from('users').select('*').eq('id', id).single();
    return data;
  }
};

// ── camelCase ↔ snake_case helpers ──
const toSnake = obj => {
  const map = {
    userId:'user_id', subCategory:'sub_category', lineDetails:'line_details',
    planCategory:'plan_category', archivedAt:'archived_at', modifiedAt:'modified_at',
    createdAt:'created_at', targetType:'target_type', targetId:'target_id',
    privateOnly:'private', publicOnly:'public', sharePublic:'share_public',
    locationType:'location_type', zoomUrl:'zoom_url', requesterId:'requester_id',
    targetEmail:'target_email', dataURL:'data_url', fromUserId:'from_user_id',
    showQuote:'show_quote',
    showGratitude:'show_gratitude', quoteAuthors:'quote_authors',
    gratitudeAuthors:'gratitude_authors', includeArchived:'include_archived',
    isPanel:'is_panel', isProject:'is_project', categoryId:'category_id',
    noteId:'note_id',
  };
  const out = {};
  for (const [k,v] of Object.entries(obj)) {
    const sk = map[k] || k;
    // Serialize arrays/objects to JSON for jsonb columns
    out[sk] = Array.isArray(v) ? v : v;
  }
  return out;
};

const fromSnake = row => {
  if (!row) return null;
  const map = {
    user_id:'userId', sub_category:'subCategory', line_details:'lineDetails',
    plan_category:'planCategory', archived_at:'archivedAt', modified_at:'modifiedAt',
    created_at:'createdAt', target_type:'targetType', target_id:'targetId',
    share_public:'sharePublic', location_type:'locationType', zoom_url:'zoomUrl',
    requester_id:'requesterId', data_url:'dataURL', from_user_id:'fromUserId',
    show_quote:'showQuote', show_gratitude:'showGratitude',
    quote_authors:'quoteAuthors', gratitude_authors:'gratitudeAuthors',
    panel_id:'panelId', is_panel:'isPanel', is_project:'isProject',
    category_id:'categoryId', note_id:'noteId',
  };
  const out = {};
  for (const [k,v] of Object.entries(row)) {
    out[map[k] || k] = v;
  }
  return out;
};

const rows = data => (data || []).map(fromSnake);

const DB = {
  // ── NOTES ──
  async getNotes(userId, f={}) {
    let q = _sb.from('notes').select('*').eq('user_id', userId);
    if (f.category)    q = q.eq('category', f.category);
    if (f.subCategory) q = q.eq('sub_category', f.subCategory);
    if (f.privateOnly) q = q.eq('private', true);
    if (f.publicOnly)  q = q.eq('private', false);
    if (!f.includeArchived) q = q.is('archived_at', null);
    if (f.keyword)     q = q.or(`name.ilike.%${f.keyword}%,body.ilike.%${f.keyword}%`);
    q = q.order('modified_at', { ascending: false });
    return rows(chk(await q));
  },
  async addNote(data) {
    const { userId, ...rest } = data;
    const row = { user_id: userId, ...toSnake(rest), modified_at: now(), created_at: now() };
    const r = chk(await _sb.from('notes').insert(row).select().single());
    return r.id;
  },
  async updateNote(id, data) {
    const row = { ...toSnake(data), modified_at: now() };
    delete row.id; delete row.user_id;
    return chk(await _sb.from('notes').update(row).eq('id', id));
  },
  async archiveNote(id)  { return chk(await _sb.from('notes').update({ archived_at: now() }).eq('id', id)); },
  async restoreNote(id)  { return chk(await _sb.from('notes').update({ archived_at: null }).eq('id', id)); },
  async deleteNote(id) {
    await _sb.from('attachments').delete().eq('target_type','note').eq('target_id', id);
    return chk(await _sb.from('notes').delete().eq('id', id));
  },

  // ── PROJECTS ──
  async getProjects(userId, f={}) {
    let q = _sb.from('projects').select('*').eq('user_id', userId);
    if (!f.includeArchived) q = q.is('archived_at', null);
    if (f.publicOnly)  q = q.eq('private', false);
    if (f.privateOnly) q = q.eq('private', true);
    if (f.category)    q = q.eq('category', f.category);
    if (f.keyword)     q = q.ilike('name', `%${f.keyword}%`);
    q = q.order('modified_at', { ascending: false });
    return rows(chk(await q));
  },
  async addProject(data) {
    const { userId, ...rest } = data;
    const row = { user_id: userId, ...toSnake(rest), visible: true, modified_at: now(), created_at: now() };
    const r = chk(await _sb.from('projects').insert(row).select().single());
    return r.id;
  },
  async updateProject(id, data) {
    const row = { ...toSnake(data), modified_at: now() };
    delete row.id; delete row.user_id;
    return chk(await _sb.from('projects').update(row).eq('id', id));
  },
  async archiveProject(id) { return chk(await _sb.from('projects').update({ archived_at: now(), visible: false }).eq('id', id)); },
  async restoreProject(id) { return chk(await _sb.from('projects').update({ archived_at: null, visible: true }).eq('id', id)); },
  async deleteProject(id) {
    await _sb.from('attachments').delete().eq('target_type','project').eq('target_id', id);
    return chk(await _sb.from('projects').delete().eq('id', id));
  },

  // ── PLANS ──
  async getPlans(userId, f={}) {
    let q = _sb.from('plans').select('*').eq('user_id', userId);
    if (!f.includeArchived) q = q.is('archived_at', null);
    if (f.planCategory) q = q.eq('plan_category', f.planCategory);
    if (f.publicOnly)   q = q.eq('private', false);
    q = q.order('modified_at', { ascending: false });
    return rows(chk(await q));
  },
  async addPlan(data) {
    const { userId, ...rest } = data;
    const row = { user_id: userId, ...toSnake(rest), modified_at: now(), created_at: now() };
    const r = chk(await _sb.from('plans').insert(row).select().single());
    return r.id;
  },
  async updatePlan(id, data) {
    const row = { ...toSnake(data), modified_at: now() };
    delete row.id; delete row.user_id;
    return chk(await _sb.from('plans').update(row).eq('id', id));
  },
  async archivePlan(id) { return chk(await _sb.from('plans').update({ archived_at: now() }).eq('id', id)); },
  async restorePlan(id) { return chk(await _sb.from('plans').update({ archived_at: null }).eq('id', id)); },
  async deletePlan(id) { return chk(await _sb.from('plans').delete().eq('id', id)); },

  // ── PORTFOLIO ──
  async getPortfolio(userId, f={}) {
    let q = _sb.from('portfolio').select('*').eq('user_id', userId);
    if (f.category) q = q.eq('category', f.category);
    if (f.keyword)  q = q.ilike('name', `%${f.keyword}%`);
    q = q.order('modified_at', { ascending: false });
    return rows(chk(await q));
  },
  async addPortfolio(data) {
    const { userId, ...rest } = data;
    const row = { user_id: userId, ...toSnake(rest), modified_at: now(), created_at: now() };
    const r = chk(await _sb.from('portfolio').insert(row).select().single());
    return r.id;
  },
  async updatePortfolio(id, data) {
    const row = { ...toSnake(data), modified_at: now() };
    delete row.id; delete row.user_id;
    return chk(await _sb.from('portfolio').update(row).eq('id', id));
  },
  async deletePortfolio(id) {
    await _sb.from('attachments').delete().eq('target_type','portfolio').eq('target_id', id);

  // ── USER PANEL CATEGORIES ──
  async getUserCategories(userId) {
    try {

      return [];

  async getArchivedCategories(userId) {

  async getCollabCategories(userId) {
    try {
      const owned = rows(chk(await _sb.from('categories').select('*').eq('user_id', userId).eq('is_project', true).eq('is_panel', true)));
      let collabCats = [];
      try {
        const collab = rows(chk(await _sb.from('project_collaborators').select('category_id, role, categories(*)').eq('user_id', userId)));
        collabCats = collab.map(c => ({ ...fromSnake(c.categories), role: c.role })).filter(c => c.id && c.userId !== userId);
      } catch(e) {}
      return [...owned, ...collabCats];

    } catch(e) { return []; }

    chk(await _sb.from('project_collaborators').insert({ category_id: categoryId, user_id: u.id, role: 'editor', joined_at: now() }));
    try { await _sb.from('notifications').insert({ user_id: u.id, type: 'collab_invite', read: false, from_user_id: inviterUserId, message: 'invited you to collaborate on a project', data: { categoryId }, created_at: now() }); } catch(e) {}
    return u;

  async getConnections(userId) {

    const recv = rows(chk(await _sb.from('connections').select('*').eq('target_id', userId)));
    return { sent, received: recv, accepted: [...sent, ...recv].filter(c => c.status === 'accepted') };

    const id = chk(await _sb.from('connections').insert({ requester_id: requesterId, target_id: targetId, status: 'pending', created_at: now() }).select().single()).id;
    await _sb.from('notifications').insert({ user_id: targetId, type: 'connection_request', read: false, from_user_id: requesterId, message: 'wants to connect with you', data: { connectionId: id }, created_at: now() });

  },

  async removeConnection(id) { return chk(await _sb.from('connections').delete().eq('id', id)); },

  async savePanelOrder(userId, panelIds) {
    const rows_ = panelIds.map((id, i) => ({ user_id: userId, panel_id: id, position: i, visible: true, updated_at: now() }));

  async renameNoteCategory(userId, oldCategory, newCategory) {

  async getDrawings(userId) {
    return rows(chk(await _sb.from('drawings').select('*').eq('user_id', userId).order('modified_at', { ascending: false })));
  },
  async addDrawing(data) {
    const { userId, name, dataURL, private: priv } = data;

    return r.id;
  },

    return chk(await _sb.from('drawings').update({ name: data.name, data_url: data.dataURL, private: data.private, modified_at: now() }).eq('id', id));
  },
  async deleteDrawing(id) { return chk(await _sb.from('drawings').delete().eq('id', id)); },

};

async function flushDraftAttachments(pending,userId,targetType,targetId){
  if(!pending?.length)return;
  for(const a of pending)await DB.addAttachment({userId,targetType,targetId,type:a.type,name:a.name,data:a.data,url:a.url});
}

function ToggleSwitch({on,onChange}){return <button className={`tog ${on?'on':''}`} onClick={()=>onChange(!on)}/>;}

function AttachmentManager({targetType,targetId,userId,max=4,readonly=false,pendingAttachments,onPendingChange}){
  const isDraft=!targetId;
  const [saved,setSaved]=useState([]);
  useEffect(()=>{if(!isDraft&&targetId)DB.getAttachments(targetType,targetId).then(setSaved);},[targetType,targetId]);
  const atts=isDraft?(pendingAttachments||[]):saved;
  const setAtts=isDraft
    ?(updater)=>onPendingChange(typeof updater==='function'?updater(pendingAttachments||[]):updater)
    :setSaved;
  const handleFile=e=>{
    Array.from(e.target.files).forEach(file=>{
      if(atts.length>=max)return;
      const r=new FileReader();
      r.onload=async ev=>{
        const type=file.type.startsWith('image/')?'image':'document';
        if(isDraft){setAtts(a=>[...a,{id:`draft-${Date.now()}-${Math.random()}`,type,name:file.name,data:ev.target.result,url:null,draft:true}]);}
        else{const id=await DB.addAttachment({userId,targetType,targetId,type,name:file.name,data:ev.target.result,url:null});setSaved(a=>[...a,{id,type,name:file.name,data:ev.target.result}]);}
      };
      r.readAsDataURL(file);
    });
    e.target.value='';
  };
  const handleUrl=async()=>{
    const url=prompt('Enter URL:');if(!url)return;
    const name=url.split('/').pop()||url;
    if(isDraft){setAtts(a=>[...a,{id:`draft-${Date.now()}`,type:'url',name,data:null,url,draft:true}]);}
    else{const id=await DB.addAttachment({userId,targetType,targetId,type:'url',name,data:null,url});setSaved(a=>[...a,{id,type:'url',name,url}]);}
  };
  const remove=async att=>{
    if(!att.draft&&att.id&&!String(att.id).startsWith('draft-'))await DB.deleteAttachment(att.id);
    setAtts(a=>a.filter(x=>x.id!==att.id));
  };
  return(
    <div>
      <div className="att-row">
        {atts.map(a=>
          a.type==='image'?<div key={a.id} className="att-wrap"><img src={a.data} className="att-img" title={a.name} onClick={()=>window.open(a.data)}/>{!readonly&&<button className="att-x" onClick={()=>remove(a)}>✕</button>}</div>:
          a.type==='url'?<div key={a.id} className="att-wrap"><div className="att-url" title={a.url} onClick={()=>window.open(a.url)}>{a.name}</div>{!readonly&&<button className="att-x" onClick={()=>remove(a)}>✕</button>}</div>:
          <div key={a.id} className="att-wrap"><div className="att-doc" title={a.name}><span>📄</span><span>{a.name?.slice(0,8)}</span></div>{!readonly&&<button className="att-x" onClick={()=>remove(a)}>✕</button>}</div>
        )}
        {!readonly&&atts.length<max&&<>
          <label className="att-add">📎 File<input type="file" style={{display:'none'}} accept="image/*,.pdf,.doc,.docx,.txt" onChange={handleFile} multiple/></label>
          <button className="att-add" onClick={handleUrl}>🔗 URL</button>
        </>}
      </div>
      {isDraft&&atts.length>0&&<div style={{fontSize:'0.68rem',color:'var(--text3)',marginTop:4,fontStyle:'italic'}}>{atts.length} attachment{atts.length>1?'s':''} ready — saves with item</div>}
    </div>
  );
}

function TextEditor({value,onChange,placeholder,rows=4}){
  const ref=useRef();
  const fmt=cmd=>{ ref.current?.focus(); document.execCommand(cmd,false,null); };
  useEffect(()=>{ if(ref.current)ref.current.innerHTML=value||''; },[]);
  return(
    <div>
      <div className="tc-row">
        {[['bold','𝐁'],['italic','𝐼'],['underline','U']].map(([c,l])=>(
          <button key={c} className="tc" onMouseDown={e=>{e.preventDefault();fmt(c);}} title={c}>{l}</button>
        ))}
        <button className="tc" title="Link" onMouseDown={e=>{e.preventDefault();const u=prompt('URL:');if(u)document.execCommand('createLink',false,u);}}>🔗</button>
        <button className="tc" title="Clear" onMouseDown={e=>{e.preventDefault();fmt('removeFormat');}}>✕</button>
      </div>
      <div ref={ref} contentEditable suppressContentEditableWarning data-placeholder={placeholder}
        onInput={e=>onChange(e.target.innerHTML)}
        style={{minHeight:rows*22,maxHeight:380,overflowY:'auto',padding:'9px 11px',
          border:'1.5px solid var(--border)',borderRadius:'var(--r)',background:'var(--panel-bg)',
          fontSize:'0.86rem',outline:'none',lineHeight:1.6,wordBreak:'break-word',
          whiteSpace:'pre-wrap',fontFamily:'var(--font)',color:'var(--text)'}}/>
    </div>
  );
}

    <div className="view-bar">

// ── PANEL WRAP ──
// sidebar: array of {key,label} — always shows as slim tab, click to open 48%
// viewMode prop: 'list'|'full' — passed down; toggle rendered in header
function PanelWrap({title,badge,children,sidebar,onSidebarClick,activeSidebar,multiSidebar,extra,onAdd,onSearch,sidebarLabel,onTitleSave,onArchivePanel,onTitleClick}){
  const [sbOpen,setSbOpen]=useState(false);
  const [maxed,setMaxed]=useState(false);
  const [collapsed,setCollapsed]=useState(false);
  const [editTitle,setEditTitle]=useState(false);
  const [titleVal,setTitleVal]=useState('');
  const startEdit=()=>{
    const noEmoji=title.replace(/^[^\w一-鿿]+/,'').trim();
    setTitleVal(noEmoji);
    setEditTitle(true);
  };
  const saveTitle=()=>{
    const v=titleVal.trim();
    if(v&&onTitleSave)onTitleSave(v);
    setEditTitle(false);
  };
  const SidebarEl=({style})=>(
    <div className={`psb ${sbOpen?'open':''}`} style={style} onClick={!sbOpen?()=>setSbOpen(true):undefined}>
      {!sbOpen&&<div className="psb-tab">{sidebarLabel||'Filter'}</div>}
      <button className="psb-close" onClick={e=>{e.stopPropagation();setSbOpen(false);}}>◁ hide</button>
      <div className="psb-btns">
        {sidebar?.map((s,i)=>(
          <button key={i} className={`sb-btn ${(multiSidebar?activeSidebar?.includes(s.key):activeSidebar===s.key)?'on':''}`}
            onClick={()=>onSidebarClick&&onSidebarClick(s.key)}>{s.label}</button>
        ))}
      </div>
    </div>
  );
  const Header=({onClose})=>(
    <div className="ph">
      {editTitle
        ?<input value={titleVal} onChange={e=>setTitleVal(e.target.value)}
            onBlur={saveTitle}
            onKeyDown={e=>{if(e.key==='Enter')saveTitle();if(e.key==='Escape')setEditTitle(false);}}
            className="ph-title-edit" autoFocus/>
        :<>
          <span className={`ph-title${onTitleClick?' ph-title-clickable':''}`}
            title={onTitleClick?'Click to open · '+(onTitleSave?'rename button →':''):onTitleSave?'Rename':'' }
            onClick={onTitleClick?onTitleClick:undefined}>{title}</span>
          {onTitleSave&&<button className="ph-rename-btn" title="Rename panel" onMouseDown={e=>{e.preventDefault();startEdit();}}>✏</button>}
        </>
      }
      {badge!=null&&<span className="ph-badge">{badge}</span>}
      <div className="irow">
        {onAdd&&!collapsed&&<button className="ib" onClick={onAdd} title="Add new">＋</button>}
        {onSearch&&!collapsed&&<button className="ib" onClick={onSearch} title="Search">🔍</button>}
        {onArchivePanel&&!collapsed&&<button className="ib" onClick={onArchivePanel} title="Archive panel" style={{fontSize:'0.75rem',color:'var(--text3)'}}>📦</button>}
        {!collapsed&&extra}
        {onClose
          ?<button className="ib" onClick={onClose} style={{fontSize:'1.1rem'}} title="Close">✕</button>
          :<><button className="ib" onClick={()=>setCollapsed(c=>!c)} title={collapsed?'Expand panel':'Collapse panel'} style={{fontSize:'0.75rem',opacity:.7}}>{collapsed?'▶':'—'}</button>
            {!collapsed&&<button className="ib" onClick={()=>setMaxed(true)} title="Maximize">⤢</button>}</>}
      </div>
    </div>
  );
  if(maxed)return(
    <>
      <div className="panel">
        <Header/>
        <div className="pb">
          <div className="pc">{children}</div>
          {sidebar?.length>0&&<SidebarEl/>}
        </div>
      </div>
      <div style={{position:'fixed',inset:'3%',zIndex:300,background:'var(--panel-bg)',borderRadius:'var(--r2)',
        boxShadow:'0 20px 80px var(--shadow2)',border:'1px solid var(--border)',display:'flex',flexDirection:'column',overflow:'hidden'}} className="fade-up">
        <Header onClose={()=>setMaxed(false)}/>
        <div className="pb" style={{flex:1,overflow:'hidden'}}>
          <div className="pc" style={{overflow:'auto'}}>{children}</div>
          {sidebar?.length>0&&<SidebarEl style={{overflow:'auto'}}/>}
        </div>
      </div>
    </>
  );
  return(
    <div className={`panel${collapsed?' collapsed':''}`}>
      <Header/>
      {!collapsed&&<div className="pb">
        <div className="pc">{children}</div>
        {sidebar?.length>0&&<SidebarEl/>}
      </div>}
    </div>
  );
}

function ItemPopup({x,y,item,onMaximize,onDetail,onEdit,canEdit,onClose,showDetail=true}){

  useEffect(()=>{
    const h=(e)=>{if(ref.current&&!ref.current.contains(e.target))onClose();};
    document.addEventListener('mousedown',h);
    return()=>document.removeEventListener('mousedown',h);
  },[]);
  const style={position:'fixed',left:Math.min(x,window.innerWidth-180),top:Math.min(y,window.innerHeight-200),zIndex:400};
  return(
    <div className="item-popup" ref={ref} style={style}>
      <div style={{fontSize:'0.7rem',fontWeight:700,color:'var(--text3)',textTransform:'uppercase',letterSpacing:'.06em',padding:'2px 6px 4px'}}>
        {item.name||'Untitled'}

      <div className="pop-divider"/>
      <button onClick={onMaximize}>⤢ &nbsp;Maximize</button>

}

// ── DETAIL VIEW
function DetailView({item,itemType,userId,onClose,onSave,canEdit,onSwitchEdit,onSwitchMaximize}){
  const ea=(arr,n=5)=>{const a=[...(arr||[])];while(a.length<n)a.push('');return a;};
  const em=(m,n=5)=>{const a=[...(m||[])];while(a.length<n)a.push([]);return a.map(r=>ea(r));};

  const initLines=()=>{
    const stored=[...(item.lines||[])];
    if(stored.every(l=>!l)&&item.body){
      const plain=item.body.replace(/<[^>]+>/g,'').trim();
      if(plain)stored[0]=plain;
    }
    while(stored.length<5)stored.push('');
    return stored;
  };

  const initLineDetails=(lines)=>{
    const stored=[...(item.lineDetails||[])];
    while(stored.length<lines.length)stored.push([]);
    return stored.map(r=>ea(r));
  };

  const initLinesArr=initLines();
  const [form,setForm]=useState({
    name:item.name||'',category:item.category||'',thesis:item.thesis||'',
    lines:initLinesArr,lineDetails:initLineDetails(initLinesArr),
  });

  const addLine=()=>setForm(f=>{
    const lines=[...f.lines,''];
    const lineDetails=[...f.lineDetails,['','','','','']];
    const nf={...f,lines,lineDetails};
    autoSave(nf);
    return nf;
  });

  const removeLine=(li)=>setForm(f=>{
    const lines=f.lines.filter((_,i)=>i!==li);
    const lineDetails=f.lineDetails.filter((_,i)=>i!==li);
    const nf={...f,lines,lineDetails};
    autoSave(nf);
    return nf;
  });

  const promoteLineToNote=async(li)=>{
    const lineText=form.lines[li];
    if(!lineText||!lineText.trim())return;
    await DB.addNote({userId,category:form.category||item.category,name:lineText,body:lineText,lines:[lineText]});
    removeLine(li);
  };

  const [atts,setAtts]=useState([]);
  const [saving,setSaving]=useState(false);
  const saveTimer=useRef(null);

  useEffect(()=>{if(item.id)DB.getAttachments(itemType,item.id).then(setAtts);},[item.id]);

  const autoSave=useCallback((updatedForm)=>{
    if(!canEdit||!item.id)return;
    clearTimeout(saveTimer.current);
    saveTimer.current=setTimeout(async()=>{
      setSaving(true);
      const data={name:updatedForm.name,category:updatedForm.category,thesis:updatedForm.thesis,
        lines:updatedForm.lines,lineDetails:updatedForm.lineDetails};
      if(itemType==='note')await DB.updateNote(item.id,data);
      else if(itemType==='project')await DB.updateProject(item.id,data);
      else if(itemType==='idea')await DB.updateIdea(item.id,data);
      else if(itemType==='portfolio')await DB.updatePortfolio(item.id,data);
      else if(itemType==='plan')await DB.updatePlan(item.id,data);
      setSaving(false);
      onSave&&onSave();
    },500);
  },[canEdit,item.id,itemType,onSave]);

  useEffect(()=>()=>clearTimeout(saveTimer.current),[]);

  const setF=(k,v)=>setForm(f=>{const nf={...f,[k]:v};autoSave(nf);return nf;});
  const setLine=(i,v)=>setForm(f=>{const lines=[...f.lines];lines[i]=v;const nf={...f,lines};autoSave(nf);return nf;});
  const setLD=(li,di,v)=>setForm(f=>{
    const ld=f.lineDetails.map((arr,ii)=>ii===li?arr.map((x,j)=>j===di?v:x):arr);
    const nf={...f,lineDetails:ld};autoSave(nf);return nf;
  });

  const save=async()=>{
    clearTimeout(saveTimer.current);
    const data={name:form.name,category:form.category,thesis:form.thesis,lines:form.lines,lineDetails:form.lineDetails};
    if(itemType==='note')await DB.updateNote(item.id,data);
    else if(itemType==='project')await DB.updateProject(item.id,data);
    else if(itemType==='idea')await DB.updateIdea(item.id,data);
    else if(itemType==='portfolio')await DB.updatePortfolio(item.id,data);
    else if(itemType==='plan')await DB.updatePlan(item.id,data);
    onSave&&onSave();
  };

  const isProjOrIdea=itemType==='project'||itemType==='idea';
  const icon=itemType==='project'?'📋':itemType==='idea'?'💡':itemType==='portfolio'?'💼':'📄';

  return(
    <FsPanel
      title={`${icon} ${form.name||'Untitled'} — Detail View`}
      onClose={onClose}
      actions={<>
        {saving&&<span style={{fontSize:'0.72rem',color:'var(--text3)',marginRight:8}}>saving…</span>}
        {canEdit&&<button className="bs b-save" onClick={save}>Save</button>}
        {(onSwitchEdit||onSwitchMaximize)&&(
          <ViewSwitcher active="detail" inline
            onEdit={onSwitchEdit||null} onDetail={()=>{}} onMaximize={onSwitchMaximize||null}
            onClose={onClose} showDetail={true}/>
        )}
      </>}>
      <div className="dv-grid">
        {/* TOP BANNER */}
        <div className="dv-top">
          {canEdit
            ?<input value={form.name} onChange={e=>setF('name',e.target.value)}
                className="dv-top-name" style={{border:'none',background:'transparent',outline:'none',width:'100%'}}/>
            :<div className="dv-top-name">{form.name||'Untitled'}</div>}
          <div className="dv-top-cat">
            {canEdit
              ?<input value={form.category} onChange={e=>setF('category',e.target.value)}
                  style={{border:'none',background:'transparent',color:'var(--text3)',outline:'none',fontSize:'0.82rem',width:'100%'}}/>
              :form.category}
          </div>
          {isProjOrIdea&&(
            <div className="dv-top-thesis">
              <div className="dv-top-thesis-label">Thesis</div>
              {canEdit
                ?<textarea value={form.thesis} onChange={e=>setF('thesis',e.target.value)} rows={2}
                    style={{width:'100%',border:'1px solid var(--border)',borderRadius:'var(--r)',padding:'5px 8px',
                      resize:'vertical',background:'var(--bg2)',color:'var(--text)',fontSize:'0.85rem'}}/>
                :<div style={{fontSize:'0.85rem',color:'var(--text2)'}}>{form.thesis}</div>}
            </div>
          )}
        </div>

        {/* NOTE LINES */}
        {form.lines.map((line,li)=>(
          <div key={li} className="dv-cell">
            <div style={{display:'flex',alignItems:'flex-start',gap:4}}>
              <span style={{fontSize:'0.6rem',color:'var(--text3)',fontWeight:700,
                paddingTop:6,minWidth:14,textAlign:'center'}}>{li+1}</span>
              <div style={{flex:1}}>
                {canEdit
                  ?<textarea value={line||''} onChange={e=>setLine(li,e.target.value)} rows={2}
                      style={{width:'100%',border:'none',borderBottom:'1px solid var(--border)',
                        borderRadius:0,padding:'4px 2px',resize:'none',background:'transparent',
                        color:'var(--text)',fontSize:'0.84rem',fontFamily:'var(--font)',outline:'none'}}/>
                  :<div style={{fontSize:'0.84rem',color:'var(--text)',minHeight:36,padding:'4px 2px'}}>{line}</div>}
                <div className="dv-sub">
                  {[0,1,2,3,4].map(di=>(
                    canEdit
                      ?<input key={di} value={(form.lineDetails[li]||[])[di]||''} onChange={e=>setLD(li,di,e.target.value)}
                          className="dv-sub-item" style={{border:'none',borderBottom:'1px solid var(--border)',
                            background:'transparent',color:'var(--text2)',outline:'none',
                            padding:'2px 4px',fontSize:'0.75rem',width:'100%'}}/>
                      :(form.lineDetails[li]||[])[di]
                        ?<div key={di} className="dv-sub-item">· {form.lineDetails[li][di]}</div>
                        :null
                  ))}
                </div>
              </div>
              {canEdit&&(
                <div style={{display:'flex',gap:2,flexShrink:0}}>
                  {form.lines[li]?.trim()&&(
                    <button onClick={()=>promoteLineToNote(li)}
                      style={{background:'none',border:'1px solid var(--border)',borderRadius:3,color:'var(--text3)',cursor:'pointer',
                        fontSize:'0.65rem',padding:'2px 5px',opacity:0.7,transition:'var(--anim)'}}
                      title="Promote to Note ↑"
                      onMouseEnter={e=>{e.target.style.background='var(--accent)';e.target.style.color='#fff';}}
                      onMouseLeave={e=>{e.target.style.background='none';e.target.style.color='var(--text3)';}}>↑</button>
                  )}
                  {form.lines.length>1&&(
                    <button onClick={()=>removeLine(li)}
                      style={{background:'none',border:'none',color:'var(--text3)',cursor:'pointer',
                        fontSize:'0.7rem',padding:'4px 2px',opacity:0.5,flexShrink:0}}
                      title="Remove line">✕</button>
                  )}
                </div>
              )}
            </div>
          </div>
        ))}

        {/* ADD LINE */}
        {canEdit&&(
          <div style={{gridColumn:'1/-1',display:'flex',justifyContent:'center',padding:'4px 0'}}>
            <button onClick={addLine}
              style={{background:'none',border:'1px dashed var(--border)',borderRadius:'var(--r)',
                padding:'6px 20px',color:'var(--text3)',cursor:'pointer',fontSize:'0.78rem',
                transition:'var(--anim)',width:'100%'}}
              onMouseEnter={e=>e.target.style.borderColor='var(--accent)'}
              onMouseLeave={e=>e.target.style.borderColor='var(--border)'}>
              ＋ Add Line
            </button>
          </div>
        )}

        {/* ATTACHMENTS */}
        {atts.map((att,ai)=>(
          <div key={`att-${att.id||ai}`} className="dv-cell" style={{minHeight:110,position:'relative'}}>
            {att.type==='image'
              ?<img src={att.data} style={{width:'100%',height:86,objectFit:'cover',borderRadius:'var(--r)',cursor:'pointer'}} onClick={()=>window.open(att.data)}/>
              :att.type==='url'
              ?<div style={{padding:'8px',background:'var(--bg2)',borderRadius:'var(--r)',cursor:'pointer',color:'var(--accent)',fontSize:'0.8rem',wordBreak:'break-all'}} onClick={()=>window.open(att.url)}>🔗 {att.url}</div>
              :<div style={{padding:'8px',background:'var(--bg2)',borderRadius:'var(--r)',fontSize:'0.8rem',color:'var(--text2)'}}>📄 {att.name}</div>}
            {canEdit&&(
              <button onClick={async()=>{await DB.deleteAttachment(att.id);setAtts(a=>a.filter(x=>x.id!==att.id));}}
                style={{position:'absolute',top:4,right:4,background:'rgba(180,50,50,0.8)',border:'none',
                  borderRadius:'50%',width:18,height:18,color:'#fff',cursor:'pointer',fontSize:10,
                  display:'flex',alignItems:'center',justifyContent:'center'}}>✕</button>
            )}
          </div>
        ))}

        {/* ADD ATTACHMENT */}
        {canEdit&&(
          <div className="dv-cell" style={{minHeight:80,display:'flex',flexDirection:'column',
            alignItems:'center',justifyContent:'center',gap:8,border:'1px dashed var(--border)'}}>
            <div style={{fontSize:'0.7rem',color:'var(--text3)',fontWeight:600}}>Add Attachment</div>
            <div style={{display:'flex',gap:6}}>
              <label style={{cursor:'pointer',padding:'4px 10px',border:'1px solid var(--border)',
                borderRadius:'var(--r)',fontSize:'0.72rem',color:'var(--text2)',background:'var(--bg2)'}}>
                📎 File
                <input type="file" style={{display:'none'}} accept="image/*,.pdf,.doc,.docx,.txt"
                  onChange={async e=>{
                    const file=e.target.files[0];if(!file||!item.id)return;
                    const r=new FileReader();
                    r.onload=async ev=>{
                      const type=file.type.startsWith('image/')?'image':'document';
                      const id=await DB.addAttachment({userId,targetType:itemType,targetId:item.id,type,name:file.name,data:ev.target.result,url:null});
                      setAtts(a=>[...a,{id,type,name:file.name,data:ev.target.result}]);
                    };
                    r.readAsDataURL(file);
                    e.target.value='';
                  }}/>
              </label>
              <button onClick={async()=>{
                  const url=prompt('Enter URL:');if(!url||!item.id)return;
                  const name=url.split('/').pop()||url;
                  const id=await DB.addAttachment({userId,targetType:itemType,targetId:item.id,type:'url',name,data:null,url});
                  setAtts(a=>[...a,{id,type:'url',name,url}]);
                }}
                style={{padding:'4px 10px',border:'1px solid var(--border)',borderRadius:'var(--r)',
                  fontSize:'0.72rem',color:'var(--text2)',background:'var(--bg2)',cursor:'pointer'}}>
                🔗 URL
              </button>
            </div>
          </div>
        )}
      </div>
     </FsPanel>
  );
}

// AUTH SCREEN
// ═══════════════════════════════════════════════════════════════
function AuthScreen({onLogin}){
  const [tab,setTab]=useState('login');
  const [email,setEmail]=useState('');
  const [username,setUsername]=useState('');
  const [pw,setPw]=useState('');const [pw2,setPw2]=useState('');
  const [showPw,setShowPw]=useState(false);
  const [err,setErr]=useState('');const [ok,setOk]=useState('');
  const [loading,setLoading]=useState(false);
  const [rEmail,setREmail]=useState('');const [rPw,setRPw]=useState('');

  const doLogin=async()=>{setErr('');setLoading(true);try{const au=await Auth.login(email,pw);const u=await Auth.getUser(au.id);onLogin(u||{id:au.id,email:au.email,username:au.user_metadata?.username||au.email});}catch(e){setErr(e.message);}finally{setLoading(false);};};
  const doReg=async()=>{setErr('');if(!email||!username||!pw){setErr('All fields required');return;}if(pw!==pw2){setErr('Passwords do not match');return;}if(pw.length<6){setErr('Password min 6 chars');return;}setLoading(true);try{await Auth.register(email,username,pw);setOk('Account created! Sign in.');setTab('login');}catch(e){setErr(e.message);}finally{setLoading(false);};};
  const doReset=async()=>{setErr('');if(!rEmail||!rPw){setErr('Fill all fields');return;}setLoading(true);try{await Auth.resetPassword(rEmail,rPw);setOk('Password reset! Sign in.');setTab('login');}catch(e){setErr(e.message);}finally{setLoading(false);};};

  return(
    <div className="auth-wrap">
      <div className="auth-card fade-up">
        <div className="auth-logo">✦ ThinkTray</div>
        <div className="auth-sub">Empty your mind. Fill your tray.</div>
        <div className="auth-tabs">
          {[['login','Sign In'],['register','Create Account'],['reset','Reset']].map(([t,l])=>(
            <button key={t} className={`auth-tab ${tab===t?'on':''}`} onClick={()=>{setTab(t);setErr('');setOk('');}  }>{l}</button>
          ))}
        </div>
        {err&&<div className="msg-err">{err}</div>}
        {ok&&<div className="msg-ok">{ok}</div>}
        {tab==='login'&&<>
          <div className="f"><label>Email</label><input type="email" value={email} onChange={e=>setEmail(e.target.value)} onKeyDown={e=>e.key==='Enter'&&doLogin()}/></div>
          <div className="f"><label>Password</label><div className="f-row"><input type={showPw?'text':'password'} value={pw} onChange={e=>setPw(e.target.value)} onKeyDown={e=>e.key==='Enter'&&doLogin()}/><button className="btn-ghost" onClick={()=>setShowPw(!showPw)}>{showPw?'Hide':'Show'}</button></div></div>
          <button className="btn-primary" onClick={doLogin} disabled={loading}>{loading?'Signing in…':'Sign In'}</button>
        </>}
        {tab==='register'&&<>
          <div className="f"><label>Email</label><input type="email" value={email} onChange={e=>setEmail(e.target.value)}/></div>
          <div className="f"><label>Username</label><input value={username} onChange={e=>setUsername(e.target.value)}/></div>
          <div className="f"><label>Password</label><div className="f-row"><input type={showPw?'text':'password'} value={pw} onChange={e=>setPw(e.target.value)}/><button className="btn-ghost" onClick={()=>setShowPw(!showPw)}>{showPw?'Hide':'Show'}</button></div></div>
          <div className="f"><label>Confirm Password</label><input type={showPw?'text':'password'} value={pw2} onChange={e=>setPw2(e.target.value)}/></div>
          <button className="btn-primary" onClick={doReg} disabled={loading}>{loading?'Creating…':'Create Account'}</button>
        </>}
        {tab==='reset'&&<>
          <div className="f"><label>Email</label><input type="email" value={rEmail} onChange={e=>setREmail(e.target.value)}/></div>
          <div className="f"><label>New Password</label><input type="password" value={rPw} onChange={e=>setRPw(e.target.value)}/></div>
          <button className="btn-primary" onClick={doReset} disabled={loading}>{loading?'Resetting…':'Reset Password'}</button>
        </>}
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// SHARED: CategorySelect — loads custom cats from DB, inline add
// Used in all modals. scope = 'note' | 'project' | 'idea' | 'portfolio'
// ═══════════════════════════════════════════════════════════════
function CategorySelect({userId,scope,value,onChange,defaultCats,placeholder='Select…'}){
  const [userCats,setUserCats]=useState([]);
  const [adding,setAdding]=useState(false);
  const [newName,setNewName]=useState('');
  const inputRef=useRef();

  useEffect(()=>{
    DB.getCategories(userId,scope).then(setUserCats);
  },[userId,scope]);

  const allCats=[...defaultCats,...userCats.map(c=>c.name)];

  const addCat=async()=>{
    const name=newName.trim();
    if(!name)return;
    await DB.addCategory(userId,scope,name);
    const updated=await DB.getCategories(userId,scope);
    setUserCats(updated);
    onChange(name); // auto-select the new category
    setNewName('');
    setAdding(false);
  };

  if(adding){
    return(
      <div style={{display:'flex',gap:4,alignItems:'center'}}>
        <input ref={inputRef} autoFocus value={newName} onChange={e=>setNewName(e.target.value)}
          onKeyDown={e=>{if(e.key==='Enter')addCat();if(e.key==='Escape')setAdding(false);}}
          placeholder="New category name…"
          style={{flex:1,padding:'5px 8px',border:'1.5px solid var(--accent)',borderRadius:'var(--r)',
            background:'var(--bg2)',color:'var(--text)',fontSize:'0.84rem'}}/>
        <button className="bs b-save" onClick={addCat} style={{padding:'5px 10px'}}>Add</button>
        <button className="bs b-cancel" onClick={()=>setAdding(false)}>✕</button>
      </div>
    );
  }

  return(
    <div style={{display:'flex',gap:4,alignItems:'center'}}>
      <select value={value} onChange={e=>onChange(e.target.value)}
        style={{flex:1,padding:'6px 8px',border:'1px solid var(--border)',borderRadius:'var(--r)',
          background:'var(--bg2)',color:'var(--text)',fontSize:'0.84rem'}}>
        {placeholder&&!value&&<option value="">{placeholder}</option>}

// ═══════════════════════════════════════════════════════════════
// NOTE EDIT MODAL (used for diary, journal)
// ═══════════════════════════════════════════════════════════════
// ── LINE EDITOR: single-line rich text with B/I/U/link toolbar
// Same height as a plain input — used for all 5 note lines in every modal
// ── BLOCK EDITOR (Notion-style) ──────────────────────────────────────────
// One contentEditable area. Enter = new block. Each block → lines[i] in DB.
// One toolbar applies to selected text anywhere in the editor.
// On save: content split by <div> blocks → lines[0..4] (max 5).
function LinesEditor({lines,onChange}){
  const ref=useRef();
  const fmt=cmd=>{document.execCommand(cmd,false,null);};
  const fmtLink=()=>{const u=prompt('URL:');if(u)document.execCommand('createLink',false,u);};

  // Build initial HTML from lines[] — each line becomes a <div>
  const toHTML=(lns)=>{
    const filled=lns.filter(Boolean);
    if(!filled.length)return'';
    return filled.map(l=>`<div>${l}</div>`).join('');
  };

  // Set content only once on mount
  useEffect(()=>{
    if(ref.current){
      const html=toHTML(lines);
      ref.current.innerHTML=html||'';
    }
  },[]);

  // Parse editor content back to lines[] — each <div> = one line
  const parseLines=()=>{
    if(!ref.current)return[''];
    const divs=Array.from(ref.current.querySelectorAll(':scope > div'));
    if(divs.length===0){
      const text=ref.current.innerHTML.replace(/<br\s*\/?>/gi,'').trim();
      return[text||''];
    }
    const result=divs.map(d=>d.innerHTML.replace(/<br\s*\/?>/gi,'').trim());
    return result.length>0?result:[''];
  };

  const handleInput=()=>{
    onChange(parseLines());
  };

  return(
    <div style={{marginBottom:10}}>
      <div style={{display:'flex',alignItems:'center',gap:0,padding:'4px 8px',
        background:'var(--panel-head)',border:'1px solid var(--border)',
        borderBottom:'none',borderRadius:'var(--r) var(--r) 0 0'}}>
        <span style={{fontSize:'0.68rem',fontWeight:700,color:'var(--text3)',
          textTransform:'uppercase',letterSpacing:'.04em',marginRight:8}}>Details</span>
        <span style={{fontSize:'0.65rem',color:'var(--text3)',marginRight:'auto'}}>
          — press Enter for new line · each detail = 1 card in Detail View
        </span>
        {[['bold','B'],['italic','𝐼'],['underline','U']].map(([c,l])=>(
          <button key={c} onMouseDown={e=>{e.preventDefault();fmt(c);}}
            style={{background:'none',border:'none',fontSize:'0.72rem',fontWeight:c==='bold'?700:400,
              padding:'2px 6px',cursor:'pointer',color:'var(--text2)',
              fontStyle:c==='italic'?'italic':'normal',
              textDecoration:c==='underline'?'underline':'none'}}>
            {l}
          </button>
        ))}
        <button onMouseDown={e=>{e.preventDefault();fmtLink();}}
          style={{background:'none',border:'none',fontSize:'0.72rem',padding:'2px 6px',
            cursor:'pointer',color:'var(--text2)'}}>🔗</button>
      </div>
      <div
        ref={ref}
        contentEditable
        suppressContentEditableWarning
        data-placeholder="Line 1 (press Enter to add more lines)…"
        onInput={handleInput}
        style={{
          minHeight:80,maxHeight:200,overflowY:'auto',
          padding:'8px 10px',
          border:'1px solid var(--border)',
          borderRadius:'0 0 var(--r) var(--r)',
          background:'var(--bg2)',
          fontSize:'0.84rem',outline:'none',
          lineHeight:1.8,color:'var(--text)',
          fontFamily:'var(--font)',
          wordBreak:'break-word',
        }}
      />
      <div style={{marginTop:4}}>
        <span style={{fontSize:'0.63rem',color:'var(--text3)',
          padding:'1px 5px',borderRadius:3,background:'var(--bg2)',
          border:'1px solid var(--border)'}}>
          Each line = 1 card in Detail View · unlimited lines
        </span>
      </div>
    </div>
  );
}

    const stored=ea(note.lines);

  const [textObjects,setTextObjects]=useState([]); // [{id,text,cssX,cssY,canvasX,canvasY,color,size,editing}]
  const nextId=useRef(1);
  const lastPos=useRef(null);

  useEffect(()=>{
    const canvas=canvasRef.current;if(!canvas)return;
    const ctx=canvas.getContext('2d');
    ctx.fillStyle='#ffffff';ctx.fillRect(0,0,canvas.width,canvas.height);
    if(!isNew&&drawing.dataURL){const img=new Image();img.onload=()=>ctx.drawImage(img,0,0);img.src=drawing.dataURL;}
  },[]);

  const getPos=(e)=>{
    const canvas=canvasRef.current;const rect=canvas.getBoundingClientRect();
    const src=e.touches?e.touches[0]:e;
    return{x:(src.clientX-rect.left)*(canvas.width/rect.width),y:(src.clientY-rect.top)*(canvas.height/rect.height)};
  };
  const startDraw=e=>{
    e.preventDefault();
    const canvas=canvasRef.current;const ctx=canvas.getContext('2d');
    setHistory(h=>[...h,ctx.getImageData(0,0,canvas.width,canvas.height)]);
    setDrawing_(true);lastPos.current=getPos(e);
    if(tool==='text'){
      const p=getPos(e);
      const rect=canvasRef.current.getBoundingClientRect();
      const clientX=e.clientX||e.touches?.[0]?.clientX||0;
      const clientY=e.clientY||e.touches?.[0]?.clientY||0;
      const id=nextId.current++;
      setTextObjects(prev=>[...prev,{
        id, text:'', editing:true,
        cssX:clientX-rect.left, cssY:clientY-rect.top,
        canvasX:p.x, canvasY:p.y,
        color, size,
      }]);
      return;
    }
  };
  const draw=e=>{
    e.preventDefault();if(!drawing_)return;
    const canvas=canvasRef.current;const ctx=canvas.getContext('2d');
    const pos=getPos(e);
    ctx.lineWidth=size;ctx.lineCap='round';ctx.lineJoin='round';
    if(tool==='pencil'){ctx.globalCompositeOperation='source-over';ctx.strokeStyle=color;ctx.beginPath();ctx.moveTo(lastPos.current.x,lastPos.current.y);ctx.lineTo(pos.x,pos.y);ctx.stroke();}
    else if(tool==='eraser'){ctx.globalCompositeOperation='destination-out';ctx.strokeStyle='rgba(0,0,0,1)';ctx.lineWidth=size*4;ctx.beginPath();ctx.moveTo(lastPos.current.x,lastPos.current.y);ctx.lineTo(pos.x,pos.y);ctx.stroke();ctx.globalCompositeOperation='source-over';}
    lastPos.current=pos;
  };
  const endDraw=()=>setDrawing_(false);
  const undo=()=>{if(!history.length)return;const canvas=canvasRef.current;const ctx=canvas.getContext('2d');ctx.putImageData(history[history.length-1],0,0);setHistory(h=>h.slice(0,-1));};
  const clear=()=>{const canvas=canvasRef.current;const ctx=canvas.getContext('2d');setHistory(h=>[...h,ctx.getImageData(0,0,canvas.width,canvas.height)]);ctx.fillStyle='#ffffff';ctx.fillRect(0,0,canvas.width,canvas.height);};
  const save=async()=>{
    // Flatten text objects onto canvas before exporting
    const canvas=canvasRef.current;
    const ctx=canvas.getContext('2d');
    const rect=canvas.getBoundingClientRect();
    const scaleX=canvas.width/rect.width;
    const scaleY=canvas.height/rect.height;
    textObjects.forEach(obj=>{
      if(!obj.text.trim())return;
      const fontSize=Math.max(12,obj.size*4);
      ctx.font=`${fontSize}px Inter,sans-serif`;
      ctx.fillStyle=obj.color;
      ctx.fillText(obj.text,obj.canvasX,obj.canvasY);
    });
    setTextObjects([]); // clear after flattening
    const dataURL=canvas.toDataURL('image/png');
    if(isNew)await DB.addDrawing({userId:user.id,name,dataURL,private:isPriv});
    else await DB.updateDrawing(drawing.id,{name,dataURL,private:isPriv});
    onSave();
  };

  return(
    <FsPanel title={`🎨 ${name||'New Drawing'}`} onClose={onClose}
      actions={<>
        <label style={{display:'flex',alignItems:'center',gap:6,fontSize:'0.82rem',color:'var(--text2)',cursor:'pointer',marginRight:8}}><input type="checkbox" checked={isPriv} onChange={e=>setIsPriv(e.target.checked)}/> Private</label>
        <input value={name} onChange={e=>setName(e.target.value)} placeholder="Drawing name…" style={{border:'1px solid var(--border)',borderRadius:'var(--r)',padding:'5px 9px',fontSize:'0.83rem',background:'var(--bg2)',color:'var(--text)',marginRight:8,width:160}}/>
        <button className="bs b-save" onClick={save}>Save Drawing</button>
        {!isNew&&onSwitchMaximize&&<ViewSwitcher active="edit" inline onEdit={()=>{}} onDetail={null} onMaximize={onSwitchMaximize} onClose={onClose} showDetail={false}/>}
      </>}>
      <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:8}}>
        <div className="draw-tools">
          {[['pencil','✏️ Pencil'],['eraser','⊘ Eraser'],['text','T Text']].map(([t,l])=>(
            <button key={t} className={`dt ${tool===t?'on':''}`} onClick={()=>setTool(t)}>{l}</button>
          ))}
          <div style={{display:'flex',alignItems:'center',gap:6,marginLeft:8}}>
            <label style={{fontSize:'0.72rem',color:'var(--text2)',fontWeight:600}}>Color</label>
            <input type="color" value={color} onChange={e=>setColor(e.target.value)} style={{width:28,height:24,padding:0,border:'1px solid var(--border)',borderRadius:3,cursor:'pointer'}}/>
          </div>
          <div style={{display:'flex',alignItems:'center',gap:6,marginLeft:4}}>
            <label style={{fontSize:'0.72rem',color:'var(--text2)',fontWeight:600}}>Size</label>
            <input type="range" min="1" max="20" value={size} onChange={e=>setSize(Number(e.target.value))} style={{width:80}}/>
            <span style={{fontSize:'0.72rem',color:'var(--text3)',width:16}}>{size}</span>
          </div>
          <button className="dt" onClick={undo}>↩ Undo</button>
          <button className="dt" onClick={clear}>🗑 Clear</button>
        </div>
        <div style={{position:'relative',display:'inline-block',maxWidth:'100%'}}>
          <canvas ref={canvasRef} width={900} height={600} className="draw-canvas"
            style={{maxWidth:'100%',display:'block',border:'1px solid var(--border)',borderRadius:'var(--r)',
              boxShadow:'0 2px 10px var(--shadow)',cursor:tool==='text'?'text':'none'}}
            onMouseDown={startDraw} onMouseMove={e=>{draw(e);const r=canvasRef.current.getBoundingClientRect();setCursorPos({x:e.clientX-r.left,y:e.clientY-r.top,visible:true});}}
            onMouseUp={endDraw} onMouseLeave={e=>{endDraw();setCursorPos(p=>({...p,visible:false}));}}
            onTouchStart={startDraw} onTouchMove={draw} onTouchEnd={endDraw}/>
          {/* Pencil/eraser cursor dot */}
          {cursorPos.visible&&tool!=='text'&&(
            <div style={{position:'absolute',pointerEvents:'none',
              left:cursorPos.x,top:cursorPos.y,
              width:tool==='eraser'?size*4:size,height:tool==='eraser'?size*4:size,
              borderRadius:'50%',
              background:tool==='eraser'?'transparent':color,
              border:tool==='eraser'?'2px solid #888':'1px solid rgba(0,0,0,0.3)',
              transform:'translate(-50%,-50%)',
              transition:'width 0.1s,height 0.1s'}}/>
          )}
          {/* Text mode cursor hint */}
          {tool==='text'&&cursorPos.visible&&(
            <div style={{position:'absolute',pointerEvents:'none',
              left:cursorPos.x,top:cursorPos.y,transform:'translate(-4px,-50%)',
              fontSize:`${Math.max(16,size*4)}px`,lineHeight:1,color:color,
              textShadow:'0 0 3px rgba(255,255,255,0.9)',userSelect:'none',opacity:0.7}}>|</div>
          )}
          {tool==='text'&&textObjects.length===0&&!cursorPos.visible&&(
            <div style={{position:'absolute',bottom:8,left:0,right:0,textAlign:'center',pointerEvents:'none',
              fontSize:'0.72rem',color:'#888',background:'rgba(255,255,255,0.7)',padding:'3px 0'}}>
              Click anywhere to add text · drag to move · double-click to edit · ✕ to delete
            </div>
          )}
          {/* TEXT LAYER — clean when idle, controls appear on hover only */}
          {textObjects.map(obj=>{
            const hovered=obj.hovered||false;
            const setHover=(v)=>setTextObjects(prev=>prev.map(o=>o.id===obj.id?{...o,hovered:v}:o));
            const onDragStart=(e)=>{
              if(obj.editing)return;
              e.stopPropagation();e.preventDefault();
              const startX=e.clientX-obj.cssX;
              const startY=e.clientY-obj.cssY;
              const onMove=(mv)=>setTextObjects(prev=>prev.map(o=>o.id===obj.id?{...o,
                cssX:mv.clientX-startX,cssY:mv.clientY-startY,
                canvasX:(mv.clientX-startX)*(canvasRef.current.width/canvasRef.current.getBoundingClientRect().width),
                canvasY:(mv.clientY-startY)*(canvasRef.current.height/canvasRef.current.getBoundingClientRect().height),
              }:o));
              const onUp=()=>{document.removeEventListener('mousemove',onMove);document.removeEventListener('mouseup',onUp);};
              document.addEventListener('mousemove',onMove);
              document.addEventListener('mouseup',onUp);
            };
            return(
              <div key={obj.id}
                onMouseEnter={()=>setHover(true)}
                onMouseLeave={()=>setHover(false)}
                onMouseDown={onDragStart}
                style={{
                  position:'absolute',left:obj.cssX,top:obj.cssY,
                  zIndex:5,display:'flex',alignItems:'center',gap:0,
                  // Clean when idle — only a very subtle outline on hover, nothing when resting
                  background: obj.editing?'rgba(255,255,255,0.95)':hovered?'rgba(255,255,255,0.75)':'transparent',
                  border: obj.editing?`1.5px solid var(--accent)`:hovered?'1px dashed rgba(100,100,100,0.4)':'1px solid transparent',
                  borderRadius:3,
                  padding: obj.editing?'2px 6px':hovered?'2px 4px':'0',
                  cursor:obj.editing?'text':hovered?'move':'default',
                  userSelect:'none',
                  transition:'background 0.1s,border 0.1s,padding 0.1s',
                }}>
                {obj.editing
                  ? <input autoFocus
                      value={obj.text}
                      placeholder="Type here…"
                      style={{border:'none',outline:'none',background:'transparent',
                        fontSize:`${Math.max(12,obj.size*4)}px`,
                        color:obj.color,minWidth:80,fontFamily:'Inter,sans-serif',lineHeight:1.2}}
                      onChange={e=>{e.stopPropagation();setTextObjects(prev=>prev.map(o=>o.id===obj.id?{...o,text:e.target.value}:o));}}
                      onMouseDown={e=>e.stopPropagation()}
                      onKeyDown={e=>{e.stopPropagation();if(e.key==='Enter'||e.key==='Escape')setTextObjects(prev=>prev.map(o=>o.id===obj.id?{...o,editing:false}:o));}}
                      onBlur={()=>setTextObjects(prev=>prev.map(o=>o.id===obj.id?{...o,editing:false}:o))}
                    />
                  : <span
                      style={{fontSize:`${Math.max(12,obj.size*4)}px`,color:obj.color,
                        fontFamily:'Inter,sans-serif',lineHeight:1.2,userSelect:'none',
                        minWidth:4,display:'inline-block'}}
                      onDoubleClick={e=>{e.stopPropagation();setTextObjects(prev=>prev.map(o=>o.id===obj.id?{...o,editing:true}:o));}}>
                      {obj.text||<span style={{color:'rgba(150,150,150,0.6)',fontStyle:'italic',fontSize:'0.75rem'}}>text…</span>}
                    </span>
                }
                {/* Delete — only visible on hover, not editing */}
                {hovered&&!obj.editing&&(
                  <button
                    onMouseDown={e=>{e.stopPropagation();setTextObjects(prev=>prev.filter(o=>o.id!==obj.id));}}
                    style={{background:'rgba(180,50,50,0.8)',border:'none',borderRadius:'50%',
                      width:14,height:14,cursor:'pointer',color:'#fff',fontSize:8,
                      display:'flex',alignItems:'center',justifyContent:'center',
                      marginLeft:4,lineHeight:1,padding:0,flexShrink:0}}>✕</button>
                )}
              </div>
            );
          })}
        </div>
      </div>
    </FsPanel>
  );
}

// JOURNAL PANEL — free-form thoughts (no subcategories)
// ═══════════════════════════════════════════════════════════════
function JournalPanel({user,refreshKey,onNewPanel}){
  const [notes,setNotes]=useState([]);
  const [selected,setSelected]=useState(null);
  const [adding,setAdding]=useState(false);
  const [detailItem,setDetailItem]=useState(null);
  const [maxItem,setMaxItem]=useState(null);
  const [promoteNote,setPromoteNote]=useState(null);
  const [demoteNote,setDemoteNote]=useState(null);
  const reload=()=>DB.getNotes(user.id,{category:'Journal'}).then(setNotes);
  useEffect(()=>{reload();},[user.id,refreshKey]);

  const promoteToPanel=async(name,note)=>{
    try{
      try{ await DB.addUserCategory(user.id,name,false); }
      catch(dup){ /* category already exists, proceed */ }
      const lines=(note.lines||[]).filter(Boolean);
      for(const line of lines){
        await DB.addNote({userId:user.id,category:name,name:line,body:line,lines:[]});
      }
      await DB.archiveNote(note.id);
      onNewPanel&&onNewPanel();
      reload();
    }catch(e){alert('Could not promote: '+(e.message||e));}
  };

  const handlePromote=(note)=>{
    const name=(note.name||'').trim();
    if(!name){setPromoteNote(note);}
    else{promoteToPanel(name,note);}
  };

  return(
    <>
      <PanelWrap title="📓 Journal" badge={notes.length} onAdd={()=>setAdding(true)}>
        {[...notes.filter(n=>n.favorited),...notes.filter(n=>!n.favorited)].map(n=>(
          <NoteCardInline key={n.id} n={n} user={user}
            onEdit={setSelected}
            onDetail={setDetailItem}
            onPromote={handlePromote}
            onDemote={setDemoteNote}
            onSaved={reload}/>
        ))}
        <QuickAddNote userId={user.id} category="Journal" onSaved={reload}/>
      </PanelWrap>
      {adding&&<NoteEditModal user={user} note={{isNew:true,category:'Journal'}} onClose={()=>setAdding(false)} onSave={()=>{setAdding(false);reload();}}/>}
      {promoteNote&&<PromoteModal onConfirm={name=>{const n=promoteNote;setPromoteNote(null);promoteToPanel(name,n);}} onClose={()=>setPromoteNote(null)}/>}
      {demoteNote&&<DemoteToDetailModal sourceNote={demoteNote} notes={notes.filter(n=>n.id!==demoteNote.id)}
        onConfirm={async(targetId)=>{
          const target=notes.find(n=>n.id===targetId);
          if(target){const newLines=[...(target.lines||[]).filter(Boolean),demoteNote.name||''].filter(Boolean);await DB.updateNote(targetId,{lines:newLines});await DB.archiveNote(demoteNote.id);}
          setDemoteNote(null);reload();
        }}
        onClose={()=>setDemoteNote(null)}/>}
      {selected&&<NoteEditModal user={user} note={selected} onClose={()=>setSelected(null)} onSave={()=>{setSelected(null);reload();}}
        onSwitchDetail={()=>{setDetailItem(selected);setSelected(null);}}
        onSwitchMaximize={()=>{setMaxItem(selected);setSelected(null);}}/>}
      {detailItem&&<DetailView item={detailItem} itemType="note" userId={user.id} canEdit={true} onClose={()=>{setDetailItem(null);reload();}} onSave={reload}
        onSwitchEdit={()=>{setSelected(detailItem);setDetailItem(null);}}
        onSwitchMaximize={()=>{setMaxItem(detailItem);setDetailItem(null);}}/>}
      {maxItem&&<MaximizeView title={`📓 ${maxItem.name||'Untitled'}`} onClose={()=>setMaxItem(null)}
        onSwitchEdit={()=>{setSelected(maxItem);setMaxItem(null);}}
        onSwitchDetail={()=>{setDetailItem(maxItem);setMaxItem(null);}}>
        <div className="ni-name" style={{fontSize:'1.1rem',fontFamily:'var(--font-h)',marginBottom:8}}>{maxItem.name||'Untitled'}</div>
        <div style={{fontSize:'0.9rem',lineHeight:1.7}} dangerouslySetInnerHTML={{__html:maxItem.body||''}}/>
      </MaximizeView>}
    </>
  );
}

// PROJECT LIST PANEL (shared between Note Grid and Project Board)

function ProjectListPanel({user,view,onAdd,onSearch,refreshKey}){
