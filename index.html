  const [archived,setArchived]=useState([]);
  const [showArch,setShowArch]=useState(false);
  const [editing,setEditing]=useState(null);
  const [detailItem,setDetailItem]=useState(null);
  const [maxItem,setMaxItem]=useState(null);
  const [popup,setPopup]=useState(null);
  const reload=()=>{
    DB.getProjects(user.id,view==='public'?{publicOnly:true}:{}).then(setProjects);
    DB.getProjects(user.id,{includeArchived:true}).then(all=>setArchived(all.filter(p=>p.archivedAt)));
  };
  useEffect(()=>{reload();},[user.id,view,refreshKey]);
  const togglePriv=async p=>{await DB.updateProject(p.id,{private:!p.private});reload();};
  return(
    <>
      <PanelWrap title="📋 Projects" badge={projects.length} onAdd={onAdd} onSearch={onSearch}>
        {projects.length===0&&<div className="empty">No projects. Click ＋ to add.</div>}
        {projects.map(p=>(
          <div key={p.id} className="ni" style={{display:'flex',alignItems:'center',gap:4}}
            onClick={e=>{e.stopPropagation();setEditing(p);}}>
            <div style={{flex:1,minWidth:0}}>
              <div className="ni-name">{p.name||'Untitled Project'}</div>
              <div className="ni-meta">{p.category} · {p.date||p.modifiedAt?.slice(0,10)}</div>
            </div>
            <button className={`bs ${p.private?'b-del':'b-cancel'}`} style={{fontSize:'0.65rem',padding:'2px 5px',flexShrink:0}}
              onClick={e=>{e.stopPropagation();togglePriv(p);}} title={p.private?'Make Public':'Make Private'}>🔒</button>
          </div>
        ))}
        {archived.length>0&&<>
          <button className="bs b-cancel" style={{width:'100%',marginTop:8,fontSize:'0.72rem'}} onClick={()=>setShowArch(!showArch)}>
            {showArch?'Hide':'Show'} Archived ({archived.length})
          </button>
          {showArch&&archived.map(p=>(
            <div key={p.id} className="ni" style={{opacity:.6,display:'flex',gap:4,alignItems:'center'}}>
              <span style={{flex:1,fontSize:'0.78rem'}}>{p.name}</span>
              <button className="bs b-ok" style={{fontSize:'0.65rem',padding:'2px 6px'}} onClick={async()=>{await DB.restoreProject(p.id);reload();}}>Restore</button>
              <button className="bs b-del" style={{fontSize:'0.65rem',padding:'2px 6px'}} onClick={async()=>{await DB.deleteProject(p.id);reload();}}>Del</button>
            </div>
          ))}
        </>}
      </PanelWrap>
      {popup&&<ItemPopup x={popup.x} y={popup.y} item={popup.item} canEdit={true}
        onMaximize={()=>{setMaxItem(popup.item);setPopup(null);}}
        onDetail={()=>{setDetailItem(popup.item);setPopup(null);}}
        onEdit={()=>{setEditing(popup.item);setPopup(null);}}
        onClose={()=>setPopup(null)}/>}
      {editing&&<ProjectEditModal user={user} project={editing} onClose={()=>setEditing(null)} onSave={()=>{setEditing(null);reload();}}
        onSwitchDetail={()=>{setDetailItem(editing);setEditing(null);}}
        onSwitchMaximize={()=>{setMaxItem(editing);setEditing(null);}}/>}
      {detailItem&&<DetailView item={detailItem} itemType="project" userId={user.id} canEdit={true} onClose={()=>{setDetailItem(null);reload();}} onSave={()=>reload()}
        onSwitchEdit={()=>{setEditing(detailItem);setDetailItem(null);}}
        onSwitchMaximize={()=>{setMaxItem(detailItem);setDetailItem(null);}}/>}
      {maxItem&&<MaximizeView title={`📋 ${maxItem.name||'Untitled'}`} onClose={()=>setMaxItem(null)}
        onSwitchEdit={()=>{setEditing(maxItem);setMaxItem(null);}}
        onSwitchDetail={()=>{setDetailItem(maxItem);setMaxItem(null);}}>
        <div style={{fontFamily:'var(--font-h)',fontSize:'1.1rem',fontWeight:700,marginBottom:6}}>{maxItem.name||'Untitled'}</div>
        <div style={{fontSize:'0.75rem',color:'var(--text3)',marginBottom:12}}>{maxItem.category} · {maxItem.date||maxItem.modifiedAt?.slice(0,10)}</div>

        {!(maxItem.lines||[]).some(Boolean)&&maxItem.body&&(
          <div style={{fontSize:'0.88rem',lineHeight:1.7,color:'var(--text2)'}} dangerouslySetInnerHTML={{__html:maxItem.body}}/>
        )}
      </MaximizeView>}
    </>
  );
}

  const cats=['all',...defaultPortCats,...customPortCats];
  const sb=cats.map(c=>({key:c,label:c==='all'?'All':c}));
  const reload=()=>DB.getPortfolio(user.id,activeSb!=='all'?{category:activeSb}:{}).then(setItems);
  useEffect(()=>{
    reload();
    DB.getCategories(user.id,'portfolio').then(custom=>{
      const extra=custom.map(c=>c.name).filter(n=>!defaultPortCats.includes(n));

        {cardView==='full'
          ? <FullCardView item={items[0]} itemType="portfolio" userId={user.id} onEdit={()=>items[0]&&setEditing(items[0])}/>
          : items.length===0?<div className="empty">No portfolio items. Click ＋.</div>:
            items.map(item=>(
              <div key={item.id} className="ni" onClick={()=>setEditing(item)}>
                <div className="ni-name">{item.name}</div>
                <div className="ni-meta">{item.category} · {item.modifiedAt?.slice(0,10)}</div>
                {item.body&&<div className="ni-body">{item.body.replace(/<[^>]+>/g,'').slice(0,60)}</div>}

      </PanelWrap>
      {editing&&<PortfolioEditModal user={user} item={editing} onClose={()=>setEditing(null)} onSave={()=>{setEditing(null);reload();}}
        onSwitchDetail={()=>{setDetailItem(editing);setEditing(null);}}
        onSwitchMaximize={()=>{setMaxItem(editing);setEditing(null);}}/>}
      {detailItem&&<DetailView item={detailItem} itemType="portfolio" userId={user.id} canEdit={true} onClose={()=>setDetailItem(null)} onSave={()=>{setDetailItem(null);reload();}}
        onSwitchEdit={()=>{setEditing(detailItem);setDetailItem(null);}}
        onSwitchMaximize={()=>{setMaxItem(detailItem);setDetailItem(null);}}/>}
      {maxItem&&<MaximizeView title={`💼 ${maxItem.name||'Untitled'}`} onClose={()=>setMaxItem(null)}
        onSwitchEdit={()=>{setEditing(maxItem);setMaxItem(null);}}

        <div className="ni-name" style={{fontSize:'1.1rem',fontFamily:'var(--font-h)',marginBottom:8}}>{maxItem.name}</div>
        <div className="ni-meta" style={{marginBottom:12}}>{maxItem.category} · {maxItem.modifiedAt?.slice(0,10)}</div>
        <div style={{fontSize:'0.9rem',lineHeight:1.7}} dangerouslySetInnerHTML={{__html:maxItem.body||''}}/>
      </MaximizeView>}
    </>
  );
}

// ═══════════════════════════════════════════════════════════════
// PROMOTE MODAL — ask for panel name when promoting a nameless note
// ═══════════════════════════════════════════════════════════════
// ═══════════════════════════════════════════════════════════════
// QUICK ADD NOTE — ghost line at bottom of any panel
// ═══════════════════════════════════════════════════════════════
function QuickAddNote({userId,category,onSaved}){
  const [active,setActive]=useState(false);
  const [val,setVal]=useState('');
  const ref=useRef();

  const save=async()=>{
    const text=val.trim();
    if(text){
      const today=new Date().toISOString().slice(0,10);
      await DB.addNote({userId,category,name:text,body:'',lines:[],date:today}).catch(()=>{});
      onSaved&&onSaved();
    }
    setVal('');
    setActive(false);
  };

  return(
    <div className="ni" style={{opacity:active?1:0.45,cursor:'text',minHeight:28,transition:'var(--anim)'}}
      onClick={()=>{if(!active){setActive(true);setTimeout(()=>ref.current?.focus(),0);}}}>
      {active
        ?<textarea ref={ref} className="ni-inline" value={val} rows={1}
            onChange={e=>setVal(e.target.value)}
            onBlur={save}
            onKeyDown={e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();save();}if(e.key==='Escape'){setVal('');setActive(false);}}}
            placeholder="New note…"/>
        :<div className="ni-name" style={{color:'var(--text3)'}}>＋ add note…</div>
      }
    </div>
  );
}

function PromoteModal({onConfirm,onClose}){
  const [name,setName]=useState('');
  return(
    <div className="overlay" onClick={onClose}>
      <div className="modal fade-up" style={{maxWidth:360}} onClick={e=>e.stopPropagation()}>
        <div className="mh"><span className="mt">↑ Promote to Panel</span><button className="ib" onClick={onClose}>✕</button></div>
        <div className="mb">
          <p style={{fontSize:'0.85rem',color:'var(--text2)',marginBottom:12}}>Enter a name for the new panel:</p>
          <input autoFocus className="si" value={name} onChange={e=>setName(e.target.value)}
            onKeyDown={e=>e.key==='Enter'&&name.trim()&&onConfirm(name.trim())}
            placeholder="Panel name…"/>
        </div>
        <div className="mf">
          <button className="bs b-cancel" onClick={onClose}>Cancel</button>
          <button className="bs b-save" disabled={!name.trim()} onClick={()=>name.trim()&&onConfirm(name.trim())}>Promote ↑</button>
        </div>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// MOVE TO PANEL MODAL
// ═══════════════════════════════════════════════════════════════
function MoveToPanelModal({note,user,onSave,onClose}){
  const [panels,setPanels]=useState([]);
  const [loading,setLoading]=useState(true);
  const [pos,setPos]=useState({top:0,left:0});
  const ref=useRef();
  const DEFAULT_NOTE_CATS=['Journal','Reviews','Goals','People','Places','Events','Things','Portfolio'];
  useEffect(()=>{
    DB.getUserCategories(user.id).catch(()=>[]).then(cats=>{
      const extra=cats.map(c=>c.name);
      const all=[...DEFAULT_NOTE_CATS,...extra.filter(n=>!DEFAULT_NOTE_CATS.includes(n))].filter(n=>n!==note.category);
      setPanels(all);setLoading(false);
    });
    // Close on click outside
    const handler=e=>{if(ref.current&&!ref.current.contains(e.target))onClose();};
    setTimeout(()=>document.addEventListener('mousedown',handler),0);
    return()=>document.removeEventListener('mousedown',handler);
  },[]);
  const moveTo=async(panel)=>{
    await DB.updateNote(note.id,{category:panel}).catch(()=>{});
    onSave&&onSave();
    onClose();
  };
  return(
    <div ref={ref} className="move-dd" style={{position:'fixed',top:pos.top||'40%',left:pos.left||'50%',transform:'translate(-50%,-50%)',zIndex:600}}>
      <div style={{padding:'6px 14px',borderBottom:'1px solid var(--border)',fontSize:'0.72rem',fontWeight:700,color:'var(--text3)',textTransform:'uppercase',letterSpacing:'.06em'}}>Move to Panel</div>
      {loading&&<div style={{padding:'10px 14px',fontSize:'0.8rem',color:'var(--text3)'}}>Loading…</div>}
      {panels.map(p=><div key={p} className="move-dd-item" onClick={()=>moveTo(p)}>{p}</div>)}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// NOTE CARD INLINE — inline-editable note card for home panels
// onDetail: opens DetailView directly from the homepage
// ═══════════════════════════════════════════════════════════════
function NoteCardInline({n,user,onEdit,onDetail,onPromote,onDemote,onSaved,dragHandleProps}){
  const [editingName,setEditingName]=useState(false);
  const [nameVal,setNameVal]=useState(n.name||'');
  const [expanded,setExpanded]=useState(false);
  const [editingDetail,setEditingDetail]=useState(null);
  const [detailVal,setDetailVal]=useState('');
  const [showMove,setShowMove]=useState(false);
  const nameRef=useRef();
  const detailRef=useRef();
  const det=(n.lines||[]).filter(Boolean);

  const saveName=async()=>{
    const text=nameVal.trim();
    if(text&&text!==n.name){
      await DB.updateNote(n.id,{name:text}).catch(()=>{});
      onSaved&&onSaved();
    }else{setNameVal(n.name||'');}
    setEditingName(false);
  };

  const saveDet=async(idx)=>{
    const text=detailVal.trim();
    const clean=det.map((d,i)=>i===idx?text:d).filter(Boolean);
    await DB.updateNote(n.id,{lines:clean}).catch(()=>{});
    setEditingDetail(null);
    onSaved&&onSaved();
  };

  useEffect(()=>{if(editingName&&nameRef.current)nameRef.current.focus();},[editingName]);
  useEffect(()=>{if(editingDetail!==null&&detailRef.current)detailRef.current.focus();},[editingDetail]);

  return(
    <div className="ni" style={{position:'relative'}} {...(dragHandleProps?{draggable:false}:{})}>
      <div style={{display:'flex',alignItems:'flex-start',gap:3}}>
        {det.length>0&&!editingName&&(
          <button className="ni-expand" onClick={e=>{e.stopPropagation();setExpanded(x=>!x);}}
            title={expanded?'Collapse':'Expand details'}>
            {expanded?'▾':'▸'}
          </button>
        )}
        <div style={{flex:1,minWidth:0}}>
          {editingName
            ?<textarea ref={nameRef} className="ni-inline" value={nameVal} rows={1}
                onChange={e=>setNameVal(e.target.value)}
                onBlur={saveName}
                onKeyDown={e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();saveName();}if(e.key==='Escape'){setNameVal(n.name||'');setEditingName(false);}}}/>
            :<div className="ni-name" style={{cursor:'text'}} onClick={()=>{setNameVal(n.name||'');setEditingName(true);}}>
                {n.name||'Untitled'}
              </div>
          }
          {expanded&&det.length>0&&(
            <div style={{paddingLeft:8,borderLeft:'2px solid var(--border)',marginTop:4}}>
              {det.map((d,i)=>(
                editingDetail===i
                  ?<input key={i} ref={editingDetail===i?detailRef:undefined} value={detailVal}
                      onChange={e=>setDetailVal(e.target.value)}
                      onBlur={()=>saveDet(i)}
                      onKeyDown={e=>{if(e.key==='Enter')saveDet(i);if(e.key==='Escape')setEditingDetail(null);}}
                      style={{width:'100%',background:'transparent',border:'none',
                        borderBottom:'1px solid var(--accent)',outline:'none',
                        fontSize:'0.74rem',color:'var(--text)',padding:'1px 0',fontFamily:'var(--font)'}}/>
                  :<div key={i} className="ni-acc-item" onClick={e=>{e.stopPropagation();setDetailVal(d);setEditingDetail(i);}}>
                      · {d}
                    </div>
              ))}
            </div>
          )}
        </div>
      </div>
      <div className="idx-btns" onClick={e=>e.stopPropagation()}>
        {dragHandleProps&&<span className="drag-handle" title="Drag to reorder" {...dragHandleProps}>⠿</span>}
        <button className="idx-btn" title="Copy to clipboard" onClick={async e=>{e.stopPropagation();const text=[n.name||'',...(n.lines||[]).filter(Boolean)].join('\n');await navigator.clipboard.writeText(text).catch(()=>{});}} >⎘</button>
        <button className={`idx-btn${n.favorited?' starred':''}`} title={n.favorited?'Unfavorite':'Favorite'} onClick={async e=>{e.stopPropagation();await DB.updateNote(n.id,{favorited:!n.favorited}).catch(()=>{});onSaved&&onSaved();}}>★</button>
        <button className="idx-btn" title="Move to panel" onClick={e=>{e.stopPropagation();setShowMove(s=>!s);}}>→</button>
        {onPromote&&<button className="idx-btn" title="Promote to Panel ↑" onClick={e=>{e.stopPropagation();onPromote(n);}}>↑</button>}
        {onDemote&&<button className="idx-btn" title="Demote to Detail ↓" onClick={e=>{e.stopPropagation();onDemote(n);}}>↓</button>}
        {onDetail&&<button className="idx-btn" title="Detail View (📋)" onClick={e=>{e.stopPropagation();onDetail(n);}}>📋</button>}
        {onEdit&&<button className="idx-btn" title="Edit" onClick={e=>{e.stopPropagation();onEdit(n);}}>✏</button>}
      </div>
      {showMove&&<MoveToPanelModal note={n} user={user} onSave={onSaved} onClose={()=>setShowMove(false)}/>}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// CUSTOM CATEGORY PANEL — user-created panel for any category
// ═══════════════════════════════════════════════════════════════
function CustomCategoryPanel({user,catId,categoryName,isProject,refreshKey,onCategoryUpdate,onRenamePanel,onArchivePanel}){
  const [notes,setNotes]=useState([]);
  const [selected,setSelected]=useState(null);
  const [detailItem,setDetailItem]=useState(null);
  const [maxItem,setMaxItem]=useState(null);
  const [showArchived,setShowArchived]=useState(false);
  const [archived,setArchived]=useState([]);
  const [demoteNote,setDemoteNote]=useState(null);
  const [showFullPanel,setShowFullPanel]=useState(false);
  const dragIdx=useRef(null);
  const emoji=isProject?'📁':'📂';
  const reload=()=>{
    DB.getNotes(user.id,{category:categoryName}).then(setNotes);
    DB.getNotes(user.id,{category:categoryName,includeArchived:true}).then(all=>setArchived(all.filter(n=>n.archivedAt)));
  };
  useEffect(()=>{reload();},[user.id,categoryName,refreshKey]);
  const addNew=()=>setSelected({isNew:true,category:categoryName,subCategory:''});
  const toggleProject=async()=>{
    if(!catId)return;
    try{
      await DB.updateUserCategory(catId,{isProject:!isProject});
      onCategoryUpdate&&onCategoryUpdate();
    }catch(e){alert('Could not update: '+(e.message||e));}
  };

  const promoteToCategory=async(note)=>{
    try{
      const catName=note.name||'Untitled';
      try{ await DB.addUserCategory(user.id,catName,false); }
      catch(dup){ /* category already exists, proceed */ }
      const lines=(note.lines||[]).filter(Boolean);
      if(lines.length>0){
        for(const line of lines){
          await DB.addNote({userId:user.id,category:catName,name:line,body:line,lines:[]});
        }
      } else if(note.body){
        const plain=note.body.replace(/<[^>]+>/g,'').trim();
        if(plain)await DB.addNote({userId:user.id,category:catName,name:catName,body:note.body,lines:[]});
      }
      await DB.archiveNote(note.id);
      onCategoryUpdate&&onCategoryUpdate();
      reload();
    }catch(e){alert('Could not promote: '+(e.message||e));}
  };

  const demoteToDetail=async(targetNote,action)=>{
    const existing=[...(targetNote.lines||[])].filter(Boolean);
    existing.push(demoteNote.name||'Untitled');
    await DB.updateNote(targetNote.id,{lines:existing});
    if(action==='move')await DB.archiveNote(demoteNote.id);
    setDemoteNote(null);
    reload();
  };

  const projectBadge=isProject
    ?<span title="Project — available in Collabs" style={{fontSize:'0.65rem',background:'var(--accent)',color:'#fff',borderRadius:8,padding:'1px 6px',fontWeight:700,cursor:'pointer'}} onClick={e=>{e.stopPropagation();toggleProject();}}>📁 Project</span>
    :<span title="Mark as Project" style={{fontSize:'0.65rem',background:'var(--bg2)',color:'var(--text3)',borderRadius:8,padding:'1px 6px',border:'1px solid var(--border)',cursor:'pointer'}} onClick={e=>{e.stopPropagation();toggleProject();}}>＋ Project</span>;
  const sortedNotes=[...notes.filter(n=>n.favorited),...notes.filter(n=>!n.favorited)];

  const makeDragProps=(i)=>({
    onMouseDown:(e)=>{e.stopPropagation();dragIdx.current=i;},
    draggable:true,
    onDragStart:(e)=>{e.dataTransfer.effectAllowed='move';dragIdx.current=i;},
    onDragOver:(e)=>{
      e.preventDefault();
      if(dragIdx.current===null||dragIdx.current===i)return;
      const arr=[...sortedNotes];
      const [moved]=arr.splice(dragIdx.current,1);
      arr.splice(i,0,moved);
      dragIdx.current=i;
      setNotes(arr);
    },
    onDragEnd:()=>{dragIdx.current=null;},
  });

  return(
    <>
      {showFullPanel&&<ProjectView user={user} categoryName={categoryName} catId={catId}
        onClose={()=>setShowFullPanel(false)} onRefresh={reload}/>}
      <PanelWrap title={`${emoji} ${categoryName}`} badge={notes.length} onAdd={addNew}
        extra={projectBadge}
        onTitleSave={onRenamePanel}
        onTitleClick={()=>setShowFullPanel(true)}
        onArchivePanel={onArchivePanel}>
        {sortedNotes.map((n,i)=>(
          <NoteCardInline key={n.id} n={n} user={user}
            onEdit={setSelected}
            onDetail={setDetailItem}
            onPromote={promoteToCategory}
            onDemote={setDemoteNote}
            onSaved={reload}
            dragHandleProps={makeDragProps(i)}/>
        ))}
        <QuickAddNote userId={user.id} category={categoryName} onSaved={reload}/>
        {archived.length>0&&<>
          <button className="bs b-cancel" style={{width:'100%',marginTop:6,fontSize:'0.72rem'}} onClick={()=>setShowArchived(!showArchived)}>
            {showArchived?'Hide':'Show'} Archived ({archived.length})
          </button>
          {showArchived&&archived.map(n=>(
            <div key={n.id} className="ni" style={{opacity:.6,display:'flex',gap:4,alignItems:'center'}}>
              <span style={{flex:1,fontSize:'0.78rem'}}>{n.name||'Untitled'}</span>
              <button className="bs b-ok" style={{fontSize:'0.65rem',padding:'2px 6px'}} onClick={async()=>{await DB.restoreNote(n.id);reload();}}>Restore</button>
            </div>
          ))}
        </>}
      </PanelWrap>
      {selected&&<NoteEditModal user={user} note={selected} onClose={()=>setSelected(null)} onSave={()=>{setSelected(null);reload();}}
        onSwitchDetail={()=>{setDetailItem(selected);setSelected(null);}}
        onSwitchMaximize={()=>{setMaxItem(selected);setSelected(null);}}/>}
      {detailItem&&<DetailView item={detailItem} itemType="note" userId={user.id} canEdit={true} onClose={()=>{setDetailItem(null);reload();}} onSave={reload}
        onSwitchEdit={()=>{setSelected(detailItem);setDetailItem(null);}}
        onSwitchMaximize={()=>{setMaxItem(detailItem);setDetailItem(null);}}/>}
      {maxItem&&<MaximizeView title={`${emoji} ${maxItem.name||'Untitled'}`} onClose={()=>setMaxItem(null)}
        onSwitchEdit={()=>{setSelected(maxItem);setMaxItem(null);}}
        onSwitchDetail={()=>{setDetailItem(maxItem);setMaxItem(null);}}>
        <div className="ni-name" style={{fontSize:'1.1rem',fontFamily:'var(--font-h)',marginBottom:8}}>{maxItem.name||'Untitled'}</div>
        <div style={{fontSize:'0.9rem',lineHeight:1.7}} dangerouslySetInnerHTML={{__html:maxItem.body||''}}/>
      </MaximizeView>}
      {demoteNote&&<DemoteToDetailModal sourceNote={demoteNote} notes={notes}
        onConfirm={demoteToDetail} onClose={()=>setDemoteNote(null)}/>}
    </>
  );
}

    return <NoteEditModal user={user} note={{isNew:true,category:'Journal',subCategory:''}} onClose={onClose} onSave={onSave}/>;
  }
  return null;
}

// ── COLUMN PICKER HOOK ──
// key: storage key so each mode remembers independently
// mobileDefault: columns to use on small screens (1)
// desktopDefault: columns to use on large screens (3)
function useColumns(key, desktopDefault=3){
  // Custom hook — reads from localStorage, falls back to mobile/desktop default
  const getInit=()=>{
    const stored=localStorage.getItem(key);
    if(stored){const n=parseInt(stored);if(n>=1&&n<=3)return n;}
    return window.innerWidth<=768?1:desktopDefault;
  };
  const [cols,setCols]=useState(getInit);
  // Wrapped setter: updates React state AND persists to localStorage
  const setAndPersist=useCallback((n)=>{
    setCols(n);
    localStorage.setItem(key,String(n));
  },[key]);
  return [cols,setAndPersist];
}

  );
}

function PanelManagerModal({user,panelOrder,panelVisible,userCats,archivedCats=[],onClose,onSave,onDeleteCat,onAddCat,onRestoreCat}){
  const [order,setOrder]=useState([...panelOrder]);
  const [vis,setVis]=useState({...panelVisible});
  const [newName,setNewName]=useState('');
  const [adding,setAdding]=useState(false);
  const [dragOver,setDragOver]=useState(null);
  const dragIdx=useRef(null);

  const onDragStart=(i)=>{dragIdx.current=i;};
  const onDragOver=(e,i)=>{
    e.preventDefault();
    setDragOver(i);
    if(dragIdx.current===null||dragIdx.current===i)return;
    const a=[...order];
    const [moved]=a.splice(dragIdx.current,1);
    a.splice(i,0,moved);
    dragIdx.current=i;
    setOrder(a);
  };
  const onDragEnd=()=>{dragIdx.current=null;setDragOver(null);};

  const save=async()=>{
    for(let i=0;i<order.length;i++){
      await DB.upsertPanelSetting(user.id,order[i],vis[order[i]]!==false,i);
    }
    onSave(order,vis);
  };
  const addCat=async()=>{
    const name=newName.trim();if(!name)return;
    try{
      await onAddCat(name);
      const newId='cat:'+name;
      setOrder(o=>o.includes(newId)?o:[...o,newId]);
    }catch(e){alert('Could not create: '+(e.message||e));}
    setNewName('');setAdding(false);
  };
  return(
    <Modal title="⚙ Manage Panels" onClose={onClose} wide
      footer={<><button className="bs b-cancel" onClick={onClose}>Cancel</button><button className="bs b-save" onClick={save}>Save</button></>}>
      <div style={{fontSize:'0.78rem',color:'var(--text3)',marginBottom:12}}>Drag ⠿ to reorder. Uncheck to hide. Custom panels can be deleted.</div>
      {order.map((id,i)=>{
        const def=DEFAULT_PANELS.find(p=>p.id===id);
        const isUserCat=id.startsWith('cat:');
        const cat=isUserCat&&userCats.find(c=>'cat:'+c.name===id);
        const label=def?.label||(cat?(cat.isProject?'📁 ':'📂 ')+cat.name:id);
        const on=vis[id]!==false;
        return(
          <div key={id} className={`panel-drag-row${dragOver===i?' drag-over':''}`}
            draggable="true"
            onDragStart={()=>onDragStart(i)}
            onDragOver={e=>onDragOver(e,i)}
            onDragEnd={onDragEnd}>
            <span className="drag-handle" title="Drag to reorder">⠿</span>
            <span style={{flex:1,fontSize:'0.88rem',color:on?'var(--text)':'var(--text3)',fontWeight:on?500:400}}>{label}</span>
            <label style={{display:'flex',alignItems:'center',gap:5,fontSize:'0.75rem',color:'var(--text2)',cursor:'pointer'}}>
              <input type="checkbox" checked={on} onChange={()=>setVis(v=>({...v,[id]:!on}))}/>
              {on?'Show':'Hide'}
            </label>
            {isUserCat&&<button className="ib" style={{color:'var(--red)'}} title="Delete panel" onClick={async()=>{
              if(!window.confirm(`Delete "${cat?.name}" panel? Notes inside will not be deleted.`))return;
              await onDeleteCat(id,cat);
              setOrder(o=>o.filter(x=>x!==id));
            }}>✕</button>}
          </div>
        );
      })}
      {archivedCats.length>0&&(
        <div style={{marginTop:16,borderTop:'1px solid var(--border)',paddingTop:12}}>
          <div style={{fontSize:'0.72rem',fontWeight:700,color:'var(--text3)',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:8}}>
            Archived Panels
          </div>
          {archivedCats.map(cat=>(
            <div key={cat.id} style={{display:'flex',alignItems:'center',gap:8,padding:'6px 0',borderBottom:'1px solid var(--border)'}}>
              <span style={{flex:1,fontSize:'0.85rem',color:'var(--text3)'}}>{cat.isProject?'📁 ':'📂 '}{cat.name}</span>
              <button className="bs b-save" style={{fontSize:'0.7rem',padding:'2px 10px'}}
                onClick={async()=>{await onRestoreCat(cat);}}>Restore</button>
              <button className="ib" style={{color:'var(--red)'}} title="Delete permanently" onClick={async()=>{
                if(!window.confirm(`Permanently delete "${cat.name}"? Notes inside will not be deleted.`))return;
                await DB.deleteUserCategory(cat.id);
                await onRestoreCat({...cat,_deleted:true});
              }}>✕</button>
            </div>
          ))}
        </div>
      )}
      <div style={{marginTop:16,borderTop:'1px solid var(--border)',paddingTop:12}}>
        {adding
          ?<div style={{display:'flex',gap:8,alignItems:'center'}}>
              <input autoFocus value={newName} onChange={e=>setNewName(e.target.value)}
                onKeyDown={e=>{if(e.key==='Enter')addCat();if(e.key==='Escape')setAdding(false);}}
                placeholder="Category name…"
                style={{flex:1,padding:'6px 10px',border:'1.5px solid var(--accent)',borderRadius:'var(--r)',background:'var(--bg2)',color:'var(--text)',fontSize:'0.86rem'}}/>
              <button className="bs b-save" onClick={addCat}>Create</button>
              <button className="bs b-cancel" onClick={()=>setAdding(false)}>Cancel</button>
            </div>
          :<button onClick={()=>setAdding(true)}
              style={{padding:'8px 16px',border:'1.5px dashed var(--border)',borderRadius:'var(--r)',background:'none',color:'var(--text3)',cursor:'pointer',fontSize:'0.85rem',width:'100%',transition:'var(--anim)'}}
              onMouseEnter={e=>e.target.style.borderColor='var(--accent)'}
              onMouseLeave={e=>e.target.style.borderColor='var(--border)'}>
              ＋ New Category Panel
            </button>
        }
      </div>
    </Modal>
  );
}

function LegacyProjectPanel({user,project,refreshKey}){
  const [editing,setEditing]=useState(null);
  const [detailItem,setDetailItem]=useState(null);
  const lines=(project.lines||[]).filter(Boolean);
  return(
    <>
      <PanelWrap title={`📋 ${project.name||'Untitled'}`} badge={lines.length}
        onAdd={()=>setEditing(project)}>
        {lines.length===0&&<div className="empty">No items.</div>}
        {lines.map((line,i)=>(
          <div key={i} className="ni" onClick={()=>setEditing(project)}>
            <div className="ni-name">{line}</div>
          </div>
        ))}
      </PanelWrap>
      {editing&&<ProjectEditModal user={user} project={editing}
        onClose={()=>setEditing(null)}
        onSave={()=>setEditing(null)}
        onSwitchDetail={()=>{setDetailItem(editing);setEditing(null);}}/>}
      {detailItem&&<DetailView item={detailItem} itemType="project" userId={user.id} canEdit={true}
        onClose={()=>setDetailItem(null)} onSave={()=>{}}
        onSwitchEdit={()=>{setEditing(detailItem);setDetailItem(null);}}/>}
    </>
  );
}

function NoteGridMode({user,view}){
  const [showSearch,setShowSearch]=useState(false);
  const [showPanelMgr,setShowPanelMgr]=useState(false);
  const [refreshKey,setRefreshKey]=useState(0);
  const refresh=()=>setRefreshKey(k=>k+1);
  const [cols,setCols]=useColumns('ng4_cols_notegrid',3);
  const [panelOrder,setPanelOrder]=useState(DEFAULT_PANELS.map(p=>p.id));
  const [panelVisible,setPanelVisible]=useState({});
  const [userCats,setUserCats]=useState([]);
  const [legacyProjects,setLegacyProjects]=useState([]);
  const [archivedCats,setArchivedCats]=useState([]);
  const [creatingPanel,setCreatingPanel]=useState(false);
  const [newPanelName,setNewPanelName]=useState('');
  const [showQuickAdd,setShowQuickAdd]=useState(false);
  const gridDragIdx=useRef(null);
  const [gridDragOver,setGridDragOver]=useState(null);

  const loadSettings=useCallback(()=>{
    const defaults=DEFAULT_PANELS.map(p=>p.id);
    return Promise.all([
      DB.getPanelSettings(user.id).catch(()=>[]),
      DB.getUserCategories(user.id).catch(()=>[]),
      DB.getProjects(user.id,{}).catch(()=>[]),
      DB.getArchivedCategories(user.id).catch(()=>[])
    ]).then(([settings,cats,legacyProjs,archived])=>{
      const legacyNames=new Set(legacyProjs.map(p=>p.name));
      const filteredCats=cats.filter(c=>!legacyNames.has(c.name));
      setUserCats(filteredCats);
      setLegacyProjects(legacyProjs);
      setArchivedCats(archived);
      const catIds=filteredCats.map(c=>'cat:'+c.name);
      const legacyIds=legacyProjs.map(p=>'legacy:'+p.id);
      if(settings.length>0){
        const saved=settings.map(s=>s.panelId);
        const vis={};settings.forEach(s=>{vis[s.panelId]=s.visible;});
        const allIds=[...saved,...defaults.filter(id=>!saved.includes(id)),...catIds.filter(id=>!saved.includes(id)),...legacyIds.filter(id=>!saved.includes(id))];
        setPanelOrder(allIds);setPanelVisible(vis);
      } else {
        setPanelOrder([...defaults,...catIds,...legacyIds]);
      }
    });
  },[user.id]);

  useEffect(()=>{loadSettings();},[loadSettings]);

  useEffect(()=>{
    const handler=e=>{
      if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.isContentEditable)return;
      if(e.ctrlKey||e.metaKey||e.altKey)return;
      if(e.key==='n'||e.key==='N'){e.preventDefault();setShowQuickAdd(true);}
      else if(e.key==='s'||e.key==='S'){e.preventDefault();setShowSearch(true);}
      else if(e.key==='p'||e.key==='P'){e.preventDefault();setShowPanelMgr(true);}
    };
    window.addEventListener('keydown',handler);
    return()=>window.removeEventListener('keydown',handler);
  },[]);

  const renamePanel=useCallback(async(oldName,newName,catId)=>{
    if(!newName?.trim()||newName===oldName)return;
    try{
      await DB.updateUserCategory(catId,{name:newName.trim()});
      await DB.renameNoteCategory(user.id,oldName,newName.trim());
      setPanelOrder(o=>o.map(id=>id==='cat:'+oldName?'cat:'+newName.trim():id));
      const s=await DB.getPanelSettings(user.id).catch(()=>[]);
      const old=s.find(x=>x.panelId==='cat:'+oldName);
      await DB.upsertPanelSetting(user.id,'cat:'+newName.trim(),old?.visible!==false,old?.position??panelOrder.length);
      // Remove the old panel setting so no duplicate panel appears
      await _sb.from('user_panel_settings').delete().eq('user_id',user.id).eq('panel_id','cat:'+oldName).catch(()=>{});
      await loadSettings();
    }catch(e){alert('Could not rename: '+(e.message||e));}
  },[user.id,loadSettings,panelOrder.length]);

  const archivePanel=useCallback(async(panelId)=>{
    if(panelId.startsWith('cat:')){
      const name=panelId.slice(4);
      const cat=userCats.find(c=>c.name===name);
      if(cat?.id)await DB.updateUserCategory(cat.id,{isPanel:false}).catch(()=>{});
    }
    await DB.upsertPanelSetting(user.id,panelId,false,999).catch(()=>{});
    loadSettings();
  },[user.id,userCats,loadSettings]);

  const makePanelEl=(id)=>{
    if(id.startsWith('legacy:')){
      const pId=id.slice(7);
      const proj=legacyProjects.find(p=>p.id===pId);
      if(!proj)return null;
      return <LegacyProjectPanel key={id} user={user} project={proj} refreshKey={refreshKey}/>;
    }
    if(id.startsWith('cat:')){
      const name=id.slice(4);
      const cat=userCats.find(c=>c.name===name);
      return <CustomCategoryPanel key={id} user={user} catId={cat?.id} categoryName={name} isProject={!!cat?.isProject}
        refreshKey={refreshKey} onCategoryUpdate={loadSettings}
        onRenamePanel={cat?.id?(newName)=>renamePanel(name,newName,cat.id):undefined}
        onArchivePanel={()=>archivePanel('cat:'+name)}/>;
    }
    switch(id){
      case 'today':    return <TodayPanel user={user}/>;
      case 'drawing':  return <DrawingPanel user={user} view={view}/>;
      case 'journal':  return <JournalPanel user={user} refreshKey={refreshKey} onNewPanel={loadSettings}/>;
      case 'reviews':  return <ReviewsPanel user={user} onSearch={()=>setShowSearch(true)} refreshKey={refreshKey} onNewPanel={loadSettings}/>;
      case 'portfolio':return <PortfolioPanel user={user} view={view} onSearch={()=>setShowSearch(true)} refreshKey={refreshKey}/>;
      case 'goals':    return <PlanCategoryPanel user={user} view={view} category="Goals"  emoji="🎯" refreshKey={refreshKey}/>;
      case 'people':   return <PlanCategoryPanel user={user} view={view} category="People" emoji="👥" refreshKey={refreshKey}/>;
      case 'places':   return <PlanCategoryPanel user={user} view={view} category="Places" emoji="📍" refreshKey={refreshKey}/>;
      case 'events':   return <PlanCategoryPanel user={user} view={view} category="Events" emoji="📅" refreshKey={refreshKey}/>;
      case 'things':   return <PlanCategoryPanel user={user} view={view} category="Things" emoji="📦" refreshKey={refreshKey}/>;
      case 'projects': return <ProjectListPanel user={user} view={view} onSearch={()=>setShowSearch(true)} refreshKey={refreshKey}/>;
      default:         return null;
    }
  };

  const addUserCat=async(name)=>{
    try{
      await DB.addUserCategory(user.id,name,false);
      const newId='cat:'+name;
      const nextPos=panelOrder.length;
      await DB.upsertPanelSetting(user.id,newId,true,nextPos).catch(()=>{});
      await loadSettings();
    }catch(e){
      alert('Could not create panel: '+(e.message||JSON.stringify(e)));
    }
  };

  const deleteUserCat=async(id,cat)=>{
    if(cat?.id)await DB.deleteUserCategory(cat.id);
    await DB.upsertPanelSetting(user.id,id,false,999);
    await loadSettings();
  };

  const restorePanel=useCallback(async(cat)=>{
    if(cat._deleted){loadSettings();return;}
    await DB.updateUserCategory(cat.id,{isPanel:true}).catch(()=>{});
    const newId='cat:'+cat.name;
    await DB.upsertPanelSetting(user.id,newId,true,panelOrder.length).catch(()=>{});
    loadSettings();
  },[user.id,loadSettings,panelOrder.length]);

  const visiblePanels=panelOrder.filter(id=>panelVisible[id]!==false);
  const NOTE_PANELS=['Journal','Reviews','Goals','People','Places','Events','Things'];
  const quickAddPanels=[...NOTE_PANELS,...userCats.map(c=>c.name).filter(n=>!NOTE_PANELS.includes(n))];

  const onPanelDragStart=(i)=>{gridDragIdx.current=i;};
  const onPanelDragOver=(e,i)=>{
    e.preventDefault();
    if(gridDragIdx.current===null||gridDragIdx.current===i)return;
    setGridDragOver(i);
    // Reorder visiblePanels → reorder panelOrder
    const vis=[...visiblePanels];
    const [moved]=vis.splice(gridDragIdx.current,1);
    vis.splice(i,0,moved);
    gridDragIdx.current=i;
    // Rebuild full panelOrder with new visible positions
    const hidden=panelOrder.filter(id=>panelVisible[id]===false);
    setPanelOrder([...vis,...hidden.filter(id=>!vis.includes(id))]);
  };
  const onPanelDragEnd=async()=>{
    gridDragIdx.current=null;
    setGridDragOver(null);
    // Persist new order
    const vis=panelOrder.filter(id=>panelVisible[id]!==false);
    for(let i=0;i<vis.length;i++){
      await DB.upsertPanelSetting(user.id,vis[i],true,i).catch(()=>{});
    }
  };

  const submitNewPanel=async()=>{
    const name=newPanelName.trim();
    if(!name)return;
    try{
      await addUserCat(name);
      setNewPanelName('');
      setCreatingPanel(false);
    }catch(e){}
  };

  return(
    <>
      <div className="mode-bar">
        {creatingPanel
          ?<>
              <input autoFocus className="si" value={newPanelName} onChange={e=>setNewPanelName(e.target.value)}
                placeholder="Panel name…"
                style={{maxWidth:160,fontSize:'0.8rem',padding:'3px 8px'}}
                onKeyDown={e=>{if(e.key==='Enter')submitNewPanel();if(e.key==='Escape'){setCreatingPanel(false);setNewPanelName('');}}}/>
              <button className="add-btn" onClick={submitNewPanel} style={{marginLeft:4}}>Create</button>
              <button className="bs b-cancel" onClick={()=>{setCreatingPanel(false);setNewPanelName('');}} style={{marginLeft:4}}>Cancel</button>
            </>
          :<button className="add-btn" onClick={()=>setCreatingPanel(true)}>New Panel ＋</button>
        }
        <button className="srch-btn" onClick={()=>setShowSearch(true)}>Search 🔍</button>
        <div className="bar-sep"/>
        <button className="srch-btn" onClick={()=>setShowPanelMgr(true)}>⊞ Panels</button>
        <div className="bar-sep"/>
        <ColPicker cols={cols} setCols={setCols}/>
      </div>
      <div className="app-main">
        <div className={`ng ng-cols-${cols}`}>
          {visiblePanels.map((id,i)=>(
            <div key={id}
              draggable="true"
              onDragStart={()=>onPanelDragStart(i)}
              onDragOver={e=>onPanelDragOver(e,i)}
              onDragEnd={onPanelDragEnd}
              style={{display:'contents'}}>
              {makePanelEl(id)}
            </div>
          ))}
        </div>
      </div>
      {showSearch&&<NoteGridSearchPanel user={user} view={view} onClose={()=>setShowSearch(false)}/>}
      {showQuickAdd&&<GlobalQuickAddModal user={user} panels={quickAddPanels} onClose={()=>setShowQuickAdd(false)} onSaved={refresh}/>}
      {showPanelMgr&&<PanelManagerModal user={user} panelOrder={panelOrder} panelVisible={panelVisible} userCats={userCats}
        archivedCats={archivedCats}
        onClose={()=>setShowPanelMgr(false)}
        onSave={(ord,vis)=>{setPanelOrder(ord);setPanelVisible(vis);setShowPanelMgr(false);}}
        onAddCat={addUserCat}
        onDeleteCat={deleteUserCat}
        onRestoreCat={restorePanel}/>}
    </>
  );
}

function CollabInviteModal({user,category,onClose,onDone}){
  const [email,setEmail]=useState('');
  const [busy,setBusy]=useState(false);
  const [err,setErr]=useState('');
  const [ok,setOk]=useState('');
  const invite=async()=>{
    const e=email.trim();if(!e)return;
    setBusy(true);setErr('');setOk('');
    try{
      const u=await DB.inviteCollaborator(category.id,e,user.id);
      setOk(`Invited ${u.username||e}!`);
      setEmail('');
      onDone&&onDone();
    }catch(ex){setErr(ex.message||'Could not invite user');}
    setBusy(false);
  };
  return(
    <div className="modal-bg" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()} style={{maxWidth:360}}>
        <div className="modal-header">
          <span>Invite Collaborator — {category.name}</span>
          <button className="modal-close" onClick={onClose}>✕</button>
        </div>
        <div style={{padding:'16px 20px 20px'}}>
          <div style={{fontSize:'0.82rem',color:'var(--text2)',marginBottom:12}}>
            Enter the email address of the person you want to invite.
          </div>
          <div className="f-row">
            <input className="f" type="email" placeholder="collaborator@email.com"
              value={email} onChange={e=>setEmail(e.target.value)}
              onKeyDown={e=>e.key==='Enter'&&invite()} style={{flex:1}}/>
            <button className="bs b-save" onClick={invite} disabled={busy} style={{marginLeft:8}}>
              {busy?'…':'Invite'}
            </button>
          </div>
          {err&&<div style={{color:'#e05a5a',fontSize:'0.8rem',marginTop:8}}>{err}</div>}
          {ok&&<div style={{color:'#28a745',fontSize:'0.8rem',marginTop:8}}>{ok}</div>}
        </div>
      </div>
    </div>
  );
}

function CollabRevisionsModal({noteId,noteName,onClose}){
  const [revs,setRevs]=useState([]);
  const [loading,setLoading]=useState(true);
  const [preview,setPreview]=useState(null);
  useEffect(()=>{
    DB.getRevisions(noteId).then(r=>{setRevs(r);setLoading(false);});
  },[noteId]);
  return(
    <div className="modal-bg" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()} style={{maxWidth:480,maxHeight:'75vh',display:'flex',flexDirection:'column'}}>
        <div className="modal-header">
          <span>History — {noteName||'Note'}</span>
          <button className="modal-close" onClick={onClose}>✕</button>
        </div>
        <div style={{flex:1,overflowY:'auto',padding:'0 0 12px'}}>
          {loading&&<div className="empty">Loading…</div>}
          {!loading&&revs.length===0&&<div className="empty">No revision history yet.<br/>Revisions are saved each time you close a note in Collabs.</div>}
          {revs.map(r=>(
            <div key={r.id}
              onClick={()=>setPreview(preview?.id===r.id?null:r)}
              style={{padding:'10px 20px',borderBottom:'1px solid var(--border)',cursor:'pointer',

              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',fontSize:'0.8rem'}}>
                <span style={{fontWeight:600,color:'var(--text)'}}>{r.users?.username||r.users?.email||'User'}</span>
                <span style={{color:'var(--text3)'}}>{r.createdAt?r.createdAt.slice(0,16).replace('T',' '):''}</span>
              </div>
              {preview?.id===r.id&&(
                <div style={{marginTop:8,background:'var(--panel-bg)',borderRadius:'var(--r)',
                  border:'1px solid var(--border)',padding:'8px 12px',fontSize:'0.8rem',color:'var(--text2)'}}>
                  <div style={{fontWeight:600,marginBottom:4}}>{r.content?.name||'Untitled'}</div>
                  {(r.content?.lines||[]).filter(Boolean).map((l,li)=>(
                    <div key={li} style={{padding:'1px 0'}}>· {l}</div>
                  ))}
                </div>
              )}
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function CollabProjectView({user,category}){
  const [notes,setNotes]=useState([]);
  const [collaborators,setCollaborators]=useState([]);
  const [selected,setSelected]=useState(null);
  const [detailItem,setDetailItem]=useState(null);
  const [showInvite,setShowInvite]=useState(false);
  const [showRevisions,setShowRevisions]=useState(null);
  const [liveMsg,setLiveMsg]=useState('');
  const isOwner=category.userId===user.id;

  const reload=useCallback(()=>{
    DB.getNotes(user.id,{category:category.name}).then(setNotes);
    DB.getCollaborators(category.id).then(setCollaborators);
  },[user.id,category.id,category.name]);

  useEffect(()=>{reload();},[reload]);

  // Real-time: listen for notes changes in this category
  useEffect(()=>{
    const ch=_sb.channel('collab:notes:'+category.id)
      .on('postgres_changes',{event:'*',schema:'public',table:'notes'},payload=>{
        const n=payload.new||payload.old||{};
        if(n.category===category.name){
          reload();
          setLiveMsg('↺ Updated by collaborator');
          setTimeout(()=>setLiveMsg(''),3500);
        }
      }).subscribe();
    return()=>{_sb.removeChannel(ch);};
  },[category.id,category.name,reload]);

  const handleDetailClose=async(noteId)=>{
    // Save a revision snapshot when the user finishes editing
    const updated=await DB.getNotes(user.id,{category:category.name});
    setNotes(updated);
    const n=updated.find(x=>x.id===noteId);
    if(n)await DB.saveRevision(noteId,user.id,{name:n.name,lines:n.lines||[]});
    setDetailItem(null);
  };

  return(
    <div style={{flex:1,display:'flex',flexDirection:'column',minWidth:0,overflow:'hidden'}}>
      {/* Project header */}
      <div style={{padding:'10px 16px',borderBottom:'1px solid var(--border)',background:'var(--bg2)',
        display:'flex',alignItems:'center',gap:8,flexWrap:'wrap',flexShrink:0}}>
        <span style={{fontFamily:'var(--font-h)',fontWeight:700,fontSize:'1.05rem',color:'var(--text)',flex:1}}>
          📁 {category.name}
        </span>
        {liveMsg&&<span style={{fontSize:'0.72rem',color:'var(--accent)',fontWeight:600}}>{liveMsg}</span>}
        {/* Avatars */}
        <div style={{display:'flex',gap:4,alignItems:'center'}}>
          <div title={`Owner: ${user.username||user.email}`}
            style={{width:26,height:26,borderRadius:'50%',background:'var(--accent)',color:'#fff',
              display:'flex',alignItems:'center',justifyContent:'center',fontSize:'0.7rem',fontWeight:700}}>
            {(user.username||user.email||'?').slice(0,1).toUpperCase()}
          </div>
          {collaborators.slice(0,4).map((c,i)=>{
            const label=c.users?.username||c.users?.email||'?';
            return(
              <div key={c.id||i} title={`${label} (${c.role||'editor'})`}
                style={{width:26,height:26,borderRadius:'50%',background:'var(--text3)',color:'#fff',
                  display:'flex',alignItems:'center',justifyContent:'center',fontSize:'0.7rem',fontWeight:700}}>
                {label.slice(0,1).toUpperCase()}
              </div>
            );
          })}
          {collaborators.length>4&&<span style={{fontSize:'0.72rem',color:'var(--text3)'}}>+{collaborators.length-4}</span>}
        </div>
        {isOwner&&(
          <button className="bs b-save" style={{fontSize:'0.75rem',padding:'3px 10px'}}
            onClick={()=>setShowInvite(true)}>＋ Invite</button>
        )}
        <button className="bs b-save" style={{fontSize:'0.75rem',padding:'3px 10px'}}
          onClick={()=>setSelected({isNew:true,category:category.name,subCategory:''})}>
          ＋ Note
        </button>
      </div>

      {/* Notes grid */}
      <div style={{flex:1,overflowY:'auto',padding:12}}>
        {notes.length===0&&(
          <div className="empty" style={{marginTop:60}}>
            No notes in this project yet.<br/>Click <strong>＋ Note</strong> to add one.
          </div>
        )}
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(220px,1fr))',gap:'var(--gap)'}}>
          {notes.map(n=>(
            <div key={n.id} className="ni" style={{padding:10}} onClick={()=>setDetailItem(n)}>
              <div className="ni-name">{n.name||'Untitled'}</div>
              {n.body&&<div className="ni-body">{n.body.replace(/<[^>]+>/g,'').slice(0,100)}</div>}
              {(n.lines||[]).filter(Boolean).length>0&&(
                <div style={{fontSize:'0.72rem',color:'var(--text2)',marginTop:4}}>
                  {(n.lines||[]).filter(Boolean).slice(0,2).map((l,li)=>(
                    <div key={li}>· {l}</div>
                  ))}
                  {(n.lines||[]).filter(Boolean).length>2&&(
                    <div style={{color:'var(--text3)'}}>+{(n.lines||[]).filter(Boolean).length-2} more</div>
                  )}
                </div>
              )}
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginTop:6}}>
                <span className="ni-meta">{n.modifiedAt?.slice(0,10)||''}</span>
                <button
                  onClick={e=>{e.stopPropagation();setShowRevisions({id:n.id,name:n.name});}}
                  style={{background:'none',border:'1px solid var(--border)',borderRadius:4,
                    fontSize:'0.65rem',padding:'1px 6px',color:'var(--text3)',cursor:'pointer'}}
                  title="Revision history">History</button>
              </div>
            </div>
          ))}
        </div>
      </div>

      {/* Modals */}
      {selected&&<NoteEditModal user={user} note={selected}
        onClose={()=>setSelected(null)}
        onSave={()=>{setSelected(null);reload();}}/>}
      {detailItem&&<DetailView item={detailItem} itemType="note" userId={user.id} canEdit={true}

function ProjectView({user,categoryName,catId,onClose,onRefresh}){
  const [notes,setNotes]=useState([]);
  const [selected,setSelected]=useState(null);
  const [saving,setSaving]=useState(false);
  const [cols,setCols]=useColumns('ng4_cols_projview_'+categoryName,3);
  const [showSublines,setShowSublines]=useState(true);
  const debouncedSaves=useRef({});
  const reload=()=>DB.getNotes(user.id,{category:categoryName}).then(setNotes);
  useEffect(()=>{reload();},[user.id,categoryName]);

  const debounceSave=(key,fn)=>{
    clearTimeout(debouncedSaves.current[key]);
    debouncedSaves.current[key]=setTimeout(fn,500);
  };

  const addNew=()=>setSelected({isNew:true,category:categoryName,subCategory:''});

  return(
    <FsPanel title={`📁 ${categoryName}`} onClose={onClose}
      actions={<>
        {saving&&<span style={{fontSize:'0.72rem',color:'var(--text3)',marginRight:8}}>saving…</span>}
        <button className={`sub-toggle-btn${showSublines?' on':''}`} onClick={()=>setShowSublines(s=>!s)}
          title={showSublines?'Hide sub-lines':'Show sub-lines'}>
          {showSublines?'Hide Sub-lines':'Show Sub-lines'}
        </button>
        <ColPicker cols={cols} setCols={setCols}/>
        <button className="bs b-save" style={{marginLeft:8}} onClick={addNew}>＋ Add Note</button>
      </>}>
      {notes.length===0
        ?<div className="empty" style={{marginTop:60}}>
            <div style={{fontSize:'2rem',marginBottom:12}}>📁</div>
            <div style={{fontWeight:700,marginBottom:8}}>{categoryName}</div>
            <div style={{fontSize:'0.85rem',color:'var(--text3)',marginBottom:16}}>No notes yet.</div>
            <button className="add-btn" onClick={addNew}>＋ Add Note</button>
          </div>
        :<div style={{display:'grid',gridTemplateColumns:`repeat(${cols},1fr)`,gap:'var(--gap)',padding:'12px'}}>
          {notes.map(note=>(
            <ProjectNoteCard key={note.id} note={note} user={user}
              showSublines={showSublines}
              onUpdateLine={(li,v)=>{
                const lines=[...(note.lines||[])];lines[li]=v;
                setNotes(prev=>prev.map(n=>n.id===note.id?{...n,lines}:n));
                debounceSave(note.id+'-l'+li,()=>DB.updateNote(note.id,{lines}));
              }}
              onUpdateLD={(li,di,v)=>{
                const ld=[...(note.lineDetails||[])];
                while(ld.length<=li)ld.push(['','','','','']);
                ld[li]=[...(ld[li]||['','','','',''])];ld[li][di]=v;
                setNotes(prev=>prev.map(n=>n.id===note.id?{...n,lineDetails:ld}:n));
                debounceSave(note.id+'-d'+li+di,()=>DB.updateNote(note.id,{lineDetails:ld}));
              }}
              onEdit={()=>setSelected(note)}
              onArchive={async()=>{await DB.archiveNote(note.id);reload();}}
            />
          ))}
        </div>
      }
      {selected&&<NoteEditModal user={user} note={selected}
        onClose={()=>setSelected(null)}
        onSave={()=>{setSelected(null);reload();onRefresh&&onRefresh();}}/>}
    </FsPanel>
  );
}

function ProjectNoteCard({note,user,onUpdateLine,onUpdateLD,onEdit,onArchive,showSublines=true}){
  const lines=(note.lines||[]).length>0?note.lines:['','','','',''];
  const lineDetails=note.lineDetails||[];
  const [expanded,setExpanded]=useState(true);
  return(
    <div className="dv-cell" style={{display:'flex',flexDirection:'column',gap:0}}>
      <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:8,paddingBottom:6,borderBottom:'1px solid var(--border)'}}>
        <span style={{fontFamily:'var(--font-h)',fontWeight:700,fontSize:'0.88rem',color:'var(--text)',flex:1,
          overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{note.name||'Untitled'}</span>
        <button onClick={()=>setExpanded(e=>!e)}
          style={{background:'none',border:'none',color:'var(--text3)',cursor:'pointer',fontSize:'0.75rem',padding:'2px 4px'}}
          title={expanded?'Collapse':'Expand'}>{expanded?'▲':'▼'}</button>
        <button onClick={onEdit}
          style={{background:'none',border:'1px solid var(--border)',borderRadius:'var(--r)',color:'var(--text3)',
            cursor:'pointer',fontSize:'0.7rem',padding:'2px 6px'}}
          onMouseEnter={e=>e.target.style.borderColor='var(--accent)'}
          onMouseLeave={e=>e.target.style.borderColor='var(--border)'}>✏️</button>
      </div>
      {expanded&&lines.map((line,li)=>(
        <div key={li} style={{marginBottom:showSublines?6:3}}>
          <div style={{display:'flex',alignItems:'flex-start',gap:4}}>
            <span style={{fontSize:'0.6rem',color:'var(--text3)',fontWeight:700,minWidth:14,paddingTop:5,textAlign:'center'}}>{li+1}</span>
            <div style={{flex:1}}>
              <textarea value={line||''} rows={1}
                onChange={e=>onUpdateLine(li,e.target.value)}
                style={{width:'100%',border:'none',borderBottom:'1px solid var(--border)',borderRadius:0,
                  padding:'3px 2px',resize:'none',background:'transparent',color:'var(--text)',
                  fontSize:'0.82rem',fontFamily:'var(--font)',outline:'none',overflow:'hidden'}}
                onInput={e=>{e.target.style.height='auto';e.target.style.height=e.target.scrollHeight+'px';}}/>
              {showSublines&&<div className="dv-sub">
                {[0,1,2,3,4].map(di=>(
                  <input key={di} value={(lineDetails[li]||[])[di]||''}
                    onChange={e=>onUpdateLD(li,di,e.target.value)}
                    className="dv-sub-item"
                    style={{border:'none',borderBottom:'1px solid var(--border)',background:'transparent',
                      color:'var(--text2)',outline:'none',padding:'2px 4px',fontSize:'0.72rem',width:'100%'}}/>
                ))}
              </div>}
            </div>
          </div>
        </div>
      ))}
    </div>
  );
}

function MapView({user,view,onClose}){
  const [items,setItems]=useState([]);
  const [filters,setFilters]=useState({notes:true,projects:true,plans:true,portfolio:true});
  const [sel,setSel]=useState(null);
  useEffect(()=>{
    const pf=view==='public'?{publicOnly:true}:{};
    Promise.all([
      DB.getNotes(user.id,pf).then(n=>n.filter(x=>x.location&&x.locationType==='address').map(x=>({...x,_type:'note'}))),
      DB.getProjects(user.id,pf).then(p=>p.filter(x=>x.address).map(x=>({...x,_type:'project'}))),
      DB.getPlans(user.id,pf).then(p=>p.filter(x=>x.address||x.location).map(x=>({...x,_type:'plan',_addr:x.address||x.location}))),
      DB.getPortfolio(user.id,pf).then(p=>p.filter(x=>x.address).map(x=>({...x,_type:'portfolio'}))),
    ]).then(r=>setItems(r.flat()));
  },[user.id,view]);
  const COLORS={note:'var(--gold)',project:'var(--blue)',plan:'var(--green)',portfolio:'var(--accent)'};
  const visible=items.filter(i=>filters[i._type+'s']||filters[i._type]);
  return(
    <div className="map-wrap">
      <div className="map-hdr">
        <span style={{fontFamily:'var(--font-h)',fontWeight:700,fontSize:'1.05rem',color:'var(--text)'}}>🗺 Map View</span>
        <div style={{display:'flex',gap:6,marginLeft:12}}>
          {['notes','projects','plans','portfolio'].map(f=>(
            <button key={f} className={`chip ${filters[f]?'on':''}`} onClick={()=>setFilters(p=>({...p,[f]:!p[f]}))}>
              {f.charAt(0).toUpperCase()+f.slice(1)}
            </button>
          ))}
        </div>
        <div style={{flex:1}}/>
        <button className="bs b-cancel" onClick={onClose}>✕ Close Map</button>
      </div>
      <div className="map-canvas">
        <div style={{textAlign:'center',opacity:.5}}>
          <div style={{fontSize:'4rem',marginBottom:14}}>🗺</div>
          <div style={{fontSize:'1rem'}}>Map — {visible.length} location{visible.length!==1?'s':''} found</div>
          <div style={{fontSize:'0.8rem',marginTop:6,opacity:.7}}>Full interactive map available with Supabase + Leaflet integration</div>
        </div>
        {visible.map((item,i)=>{
          const angle=(i/Math.max(visible.length,1))*2*Math.PI;
          const x=50+Math.cos(angle)*28;const y=50+Math.sin(angle)*22;
          return(<div key={item.id} className="map-pin" title={item.name}
            style={{left:`${Math.max(8,Math.min(88,x))}%`,top:`${Math.max(8,Math.min(88,y))}%`,background:COLORS[item._type]||'var(--gold)'}}
            onClick={()=>setSel(item)}/>);
        })}
      </div>
      {sel&&<div style={{position:'absolute',bottom:20,left:'50%',transform:'translateX(-50%)',background:'var(--panel-bg)',borderRadius:'var(--r2)',padding:'12px 16px',boxShadow:'0 8px 30px var(--shadow2)',minWidth:240,border:'1px solid var(--border)'}}>
        <div style={{fontFamily:'var(--font-h)',fontWeight:700,color:'var(--text)',marginBottom:4}}>{sel.name}</div>
        <div style={{fontSize:'0.78rem',color:'var(--text3)',marginBottom:8}}>{sel._type} · {sel._addr||sel.location||sel.address}</div>
        <button className="bs b-cancel" onClick={()=>setSel(null)}>Close</button>
      </div>}
    </div>
  );
}

function NotifPanel({user,onClose}){

  const markRead=async n=>{await DB.markNotifRead(n.id);setNotifs(p=>p.map(x=>x.id===n.id?{...x,read:true}:x));};
  return(
    <div className="notif-pop">
      <div style={{padding:'9px 12px',borderBottom:'1px solid var(--border)',display:'flex',alignItems:'center',justifyContent:'space-between'}}>

        <button className="ib" onClick={onClose}>✕</button>
      </div>
      {notifs.length===0?<div className="empty" style={{padding:16}}>No notifications.</div>:

            {!n.read&&<div className="ni-dot"/>}
            <div><div style={{fontSize:'0.78rem'}}>{n.message}</div><div style={{fontSize:'0.68rem',color:'var(--text3)',marginTop:2}}>{n.type} · {n.createdAt?.slice(0,10)}</div></div>
          </div>

function ConnectionsSection({user}){
  const [conns,setConns]=useState({sent:[],received:[],accepted:[]});
  const [email,setEmail]=useState('');
  const [err,setErr]=useState('');const [ok,setOk]=useState('');
  const reload=()=>DB.getConnections(user.id).then(setConns);
  useEffect(()=>{reload();},[user.id]);
  const request=async()=>{setErr('');setOk('');try{await DB.requestConnection(user.id,email);setOk('Request sent!');setEmail('');reload();}catch(e){setErr(e.message);}};
  const respond=async(c,accept)=>{await DB.respondConnection(c.id,accept);reload();};
  const disconnect=async c=>{await DB.removeConnection(c.id);reload();};
  return(
    <>
      <div className="sec"><h3>Connect with Someone</h3>
        {err&&<div className="msg-err">{err}</div>}{ok&&<div className="msg-ok">{ok}</div>}
        <div style={{display:'flex',gap:8}}><input className="si" style={{flex:1}} placeholder="Their email" value={email} onChange={e=>setEmail(e.target.value)}/><button className="bs b-save" onClick={request}>Request</button></div>
      </div>
      <div className="sec"><h3>Pending ({conns.received.filter(c=>c.status==='pending').length})</h3>
        {conns.received.filter(c=>c.status==='pending').map(c=>(
          <div key={c.id} style={{display:'flex',gap:8,alignItems:'center',padding:'6px 0',borderBottom:'1px solid var(--border)'}}>
            <span style={{flex:1,fontSize:'0.83rem'}}>User #{c.requesterId}</span>
            <button className="bs b-ok" onClick={()=>respond(c,true)}>Accept</button>
            <button className="bs b-del" onClick={()=>respond(c,false)}>Decline</button>
          </div>
        ))}
        {conns.received.filter(c=>c.status==='pending').length===0&&<div className="empty" style={{padding:'8px 0'}}>No pending requests.</div>}
      </div>
      <div className="sec"><h3>My Connections ({conns.accepted.length})</h3>
        {conns.accepted.map(c=>{const otherId=c.requesterId===user.id?c.targetId:c.requesterId;return(
          <div key={c.id} style={{display:'flex',gap:8,alignItems:'center',padding:'6px 0',borderBottom:'1px solid var(--border)'}}>
            <span style={{flex:1,fontSize:'0.83rem'}}>User #{otherId}</span>
            <button className="bs b-del" onClick={()=>disconnect(c)}>Disconnect</button>
          </div>
        );})}
        {conns.accepted.length===0&&<div className="empty" style={{padding:'8px 0'}}>No connections yet.</div>}
      </div>
    </>
  );
}

function AccountModal({user,onClose,onLogout}){
  const [tab,setTab]=useState('profile');
  const [username,setUsername]=useState(user.username);
  const [bio,setBio]=useState(user.bio||'');
  const [saved,setSaved]=useState(false);
  const save=async()=>{await _sb.from('users').update({username,bio}).eq('id',user.id);setSaved(true);setTimeout(()=>setSaved(false),2000);};
  const tabs=[['profile','Profile'],['connections','Connections'],['reports','Reports']];
  return(
    <Modal title="👤 Account" onClose={onClose} wide>
      <div style={{display:'flex',gap:4,marginBottom:16}}>
        {tabs.map(([t,l])=><button key={t} className={`chip ${tab===t?'on':''}`} onClick={()=>setTab(t)}>{l}</button>)}
      </div>
      {tab==='profile'&&<>
        {saved&&<div className="msg-ok">Profile saved!</div>}
        <div className="fg" style={{marginBottom:10}}><label>Email</label><input value={user.email} disabled style={{opacity:.6}}/></div>
        <div className="fg" style={{marginBottom:10}}><label>Username</label><input value={username} onChange={e=>setUsername(e.target.value)}/></div>
        <div className="fg" style={{marginBottom:14}}><label>Bio</label><textarea value={bio} onChange={e=>setBio(e.target.value)} rows={3} style={{resize:'vertical'}}/></div>
        <div style={{display:'flex',gap:8}}>
          <button className="bs b-save" onClick={save}>Save Profile</button>

        </div>
      </>}
      {tab==='connections'&&<ConnectionsSection user={user}/>}
      {tab==='reports'&&<ReportsTab user={user}/>}
    </Modal>
  );
}

function ReportsTab({user}){
  const [stats,setStats]=useState(null);
  useEffect(()=>{
    Promise.all([DB.getNotes(user.id,{}),DB.getProjects(user.id,{}),DB.getPlans(user.id,{}),DB.getPortfolio(user.id,{}),DB.getDrawings(user.id)]).then(([n,p,pl,po,d])=>{
      const byCat={};n.forEach(x=>{const k=x.subCategory||x.category;byCat[k]=(byCat[k]||0)+1;});
      setStats({notes:n.length,projects:p.length,plans:pl.length,portfolio:po.length,drawings:d.length,byCat});
    });
  },[user.id]);
  if(!stats)return <div className="empty">Loading…</div>;
  return(
    <>
      <div className="sec"><h3>Summary</h3>
        {[['Notes',stats.notes],['Projects',stats.projects],['Plans',stats.plans],['Portfolio',stats.portfolio],['Drawings',stats.drawings]].map(([k,v])=>(
          <div key={k} className="tr"><span className="tl">{k}</span><span style={{fontWeight:700,color:'var(--text)'}}>{v}</span></div>
        ))}
      </div>
      <div className="sec"><h3>Notes by Category</h3>
        {Object.entries(stats.byCat).map(([k,v])=>(
          <div key={k} className="tr"><span className="tl">{k}</span><span style={{fontWeight:700,color:'var(--text)'}}>{v}</span></div>
        ))}
      </div>
    </>
  );
}

function SettingsModal({user,onClose,theme,setTheme}){
  const [tab,setTab]=useState('appearance');
  const [cats,setCats]=useState({note:[],project:[]});
  const [newCat,setNewCat]=useState({note:'',project:''});
  useEffect(()=>{
    Promise.all([DB.getCategories(user.id,'note'),DB.getCategories(user.id,'project')]).then(([n,p])=>setCats({note:n,project:p}));
  },[user.id]);
  const addCat=async scope=>{const name=newCat[scope].trim();if(!name)return;await DB.addCategory(user.id,scope,name);const u=await DB.getCategories(user.id,scope);setCats(p=>({...p,[scope]:u}));setNewCat(p=>({...p,[scope]:''}));};
  const removeCat=async(id,scope)=>{await DB.deleteCategory(id);setCats(p=>({...p,[scope]:p[scope].filter(c=>c.id!==id)}));};
  return(
    <Modal title="⚙ Settings" onClose={onClose} wide>
      <div style={{display:'flex',gap:4,marginBottom:16,flexWrap:'wrap'}}>
        {[['appearance','Appearance'],['categories','Categories']].map(([t,l])=><button key={t} className={`chip ${tab===t?'on':''}`} onClick={()=>setTab(t)}>{l}</button>)}
      </div>
      {tab==='appearance'&&(
        <div className="sec"><h3>Theme</h3>
          <div className="tr">
            <span className="tl">Dark Mode</span>
            <ToggleSwitch on={theme==='dark'} onChange={v=>setTheme(v?'dark':'light')}/>
          </div>
          <div style={{marginTop:12,fontSize:'0.83rem',color:'var(--text2)',lineHeight:1.6}}>
            Light mode is clean and bright. Dark mode is easier on the eyes in low light.
          </div>
        </div>
      )}
      {tab==='categories'&&['note','project'].map(scope=>(
        <div key={scope} className="sec"><h3>{scope.charAt(0).toUpperCase()+scope.slice(1)} Categories</h3>
          <div className="tags">{cats[scope].map(c=><div key={c.id} className="tag">{c.name}<button className="tag-x" onClick={()=>removeCat(c.id,scope)}>✕</button></div>)}</div>
          <div style={{display:'flex',gap:6,marginTop:8}}>
            <input className="si" style={{flex:1}} placeholder={`New ${scope} category`} value={newCat[scope]} onChange={e=>setNewCat(p=>({...p,[scope]:e.target.value}))} onKeyDown={e=>e.key==='Enter'&&addCat(scope)}/>
            <button className="bs b-save" onClick={()=>addCat(scope)}>Add</button>
          </div>
        </div>
      ))}
    </Modal>
  );
}

// ═══════════════════════════════════════════════════════════════
// MAIN APP
// ═══════════════════════════════════════════════════════════════
function App(){
  const [user,setUser]=useState(null);
  const [mode,setMode]=useState('notegrid');
  const view='all';
  const [theme,setTheme]=useState(()=>localStorage.getItem('ng4_theme')||'light');
  const [showMap,setShowMap]=useState(false);
  const [showAccount,setShowAccount]=useState(false);
  const [showSettings,setShowSettings]=useState(false);
  const [showNotifs,setShowNotifs]=useState(false);
  const [notifCount,setNotifCount]=useState(0);

  useEffect(()=>{
    document.documentElement.setAttribute('data-theme',theme);
    localStorage.setItem('ng4_theme',theme);
  },[theme]);
  useEffect(()=>{const s=Auth.getSession();if(s)Auth.getUser(s.userId).then(u=>{if(u)setUser(u);else _sb.auth.getUser().then(({data})=>{if(data?.user)setUser({id:data.user.id,email:data.user.email,username:data.user.user_metadata?.username||data.user.email});});});},[]);
  useEffect(()=>{if(!user)return;DB.getNotifications(user.id).then(n=>setNotifCount(n.filter(x=>!x.read).length));},[user,showNotifs]);

  const handleLogin=u=>setUser(u);
  const handleLogout=()=>{Auth.logout();setUser(null);};

  useEffect(()=>{
    if(!user)return;
    const handler=e=>{
      if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.isContentEditable)return;
      if(e.ctrlKey||e.metaKey||e.altKey)return;
      if(e.key==='m'||e.key==='M'){e.preventDefault();setShowMap(m=>!m);}
      else if(e.key==='Escape'){setShowMap(false);setShowAccount(false);setShowSettings(false);setShowNotifs(false);}
    };
    window.addEventListener('keydown',handler);
    return()=>window.removeEventListener('keydown',handler);
  },[user]);

  if(!user)return <AuthScreen onLogin={handleLogin}/>;

  return(
    <AppCtx.Provider value={{user,mode,view,setMode,theme,setTheme}}>
      <div style={{height:'100vh',display:'flex',flexDirection:'column',background:'var(--bg)'}}>
        {/* ── HEADER ── */}
        <div className="hdr">
          {/* ── ROW 1: logo, utility, privacy, theme ── */}
          <div className="hdr-row1">
            <div className="hdr-logo">✦ ThinkTray</div>
            
            <div className="hdr-hi">Hi, {user.username}</div>
            <div className="sp"/>
            <button className="hbtn" onClick={()=>setShowMap(true)}>🗺 Map</button>
            <div style={{position:'relative'}}>
              <button className={`hbtn nb`} onClick={()=>setShowNotifs(!showNotifs)}>
                🔔{notifCount>0&&<span className="n-badge">{notifCount}</span>}
              </button>
              {showNotifs&&<NotifPanel user={user} onClose={()=>setShowNotifs(false)}/>}
            </div>
            <button className="hbtn" onClick={()=>setShowAccount(true)}>👤 Account</button>
            <button className="hbtn" onClick={()=>setShowSettings(true)}>⚙ Settings</button>
            <button className="hbtn" onClick={()=>setTheme(t=>t==='dark'?'light':'dark')} title="Toggle theme" style={{fontSize:'1rem',padding:'4px 8px'}}>
              {theme==='dark'?'☀️':'🌙'}
            </button>
          </div>
          {/* ── ROW 2: mode toggle, full width, centered ── */}
          <div className="hdr-row2">
            <div className="mode-seg">
              <button className={mode==='notegrid'?'on':''} onClick={()=>setMode('notegrid')}>📝 Note Grid</button>
              <button className={mode==='collabs'?'on':''} onClick={()=>setMode('collabs')}>🤝 Collabs</button>
              <button className={mode==='projectboard'?'on':''} onClick={()=>setMode('projectboard')}>📋 Project Board</button>
            </div>
          </div>
        </div>
        {/* ── MODES ── */}
        {mode==='notegrid'&&<NoteGridMode user={user} view={view}/>}
        {mode==='collabs'&&<CollabsMode user={user}/>}
        {mode==='projectboard'&&<ProjectBoardMode user={user}/>}
        {/* ── KEYBOARD HINTS ── */}
        <div className="kbd-hints">
          {[['N','New note'],['S','Search'],['P','Panels'],['M','Map'],['Esc','Close']].map(([k,l])=>(
            <span key={k} className="kbd-hint"><span className="kbd-key">{k}</span> {l}</span>
          ))}
        </div>
        {/* ── OVERLAYS ── */}
        {showMap&&<MapView user={user} view={view} onClose={()=>setShowMap(false)}/>}
        {showAccount&&<AccountModal user={user} onClose={()=>setShowAccount(false)} onLogout={handleLogout}/>}
        {showSettings&&<SettingsModal user={user} onClose={()=>setShowSettings(false)} theme={theme} setTheme={setTheme}/>}
      </div>
    </AppCtx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
